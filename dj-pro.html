
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* SLIKA - NE MENJA SE */

#display {
    position: relative;
    width: min(100vw, 300vh);
    aspect-ratio: 3 / 1;
    flex: none;
    overflow: hidden;
    background: #080606 url("./display-bg.png")
        center / 100% 100% no-repeat;
    font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR / OFF AIR */

#air {
    position: absolute;
    left: 35%;
    top: 8%;
    width: 30%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    color: #fff1e8;
    font-weight: 900;
    letter-spacing: 0.03em;
    text-shadow:
        0 0 8px #ff2515,
        0 0 18px #b90000,
        2px 3px 2px #290000;
}

#air.off {
    color: #9b8c86;
    text-shadow: 2px 3px 3px #100808;
}

/* DJ IME */

#dj-name {
    position: absolute;
    left: 30%;
    top: 37%;
    width: 40%;
    height: 14%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    color: #eee7df;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    text-shadow:
        2px 2px 0 #503028,
        4px 4px 0 #100b09;
}

/* VU KAZALJKE */

#vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.needle {
    stroke: #ff3020;
    stroke-width: 4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #ff2515);
}

.pivot {
    fill: #34231c;
    stroke: #a58a75;
    stroke-width: 2;
}

/*
   PEAK L / PEAK R
   FINO PORAVNANJE SA CRNIM OTVORIMA
*/

.peak-meter {
    position: absolute;
    top: 79.8%;
    height: 11.2%;
    display: flex;
    align-items: stretch;
    gap: 0.25%;
    padding: 0.25%;
    overflow: hidden;
    background: #070907;
    border-radius: 2px;
}

/* LEVI PEAK */

#peak-left {
    left: 1.9%;
    width: 21.3%;
}

/* DESNI PEAK */

#peak-right {
    left: 76.5%;
    width: 21%;
}

.peak-segment {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: #111713;
    border: 1px solid #060806;
}

.peak-segment.active.green {
    background: #0df03a;
    box-shadow: 0 0 5px #11e23c;
}

.peak-segment.active.yellow {
    background: #ffe51c;
    box-shadow: 0 0 5px #ffe51c;
}

.peak-segment.active.red {
    background: #ff2817;
    box-shadow: 0 0 6px #ff2817;
}

/* SPECTRUM */

#spectrum {
    position: absolute;
    left: 29%;
    top: 67.2%;
    width: 42%;
    height: 27%;
    display: flex;
    align-items: flex-end;
    gap: 0.45%;
    overflow: hidden;
}

.spectrum-bar {
    flex: 1;
    min-width: 0;
    height: 3%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0 5px,
            #080808 5px 8px
        ),
        linear-gradient(
            to top,
            #0ce238 0%,
            #28e91d 33%,
            #f4e11d 55%,
            #ff9916 75%,
            #f52416 100%
        );
    transition: height 0.14s linear;
}
</style>
</head>

<body>

<div id="display">

    <div id="air" class="off">OFF AIR</div>

    <div id="dj-name">DJ OFFLINE</div>

    <svg
        id="vu-overlay"
        viewBox="0 0 1000 333.333"
        preserveAspectRatio="none"
        aria-hidden="true">

        <g id="vu-left">
            <line
                class="needle"
                x1="150"
                y1="174"
                x2="150"
                y2="88">
            </line>
            <circle
                class="pivot"
                cx="150"
                cy="174"
                r="5">
            </circle>
        </g>

        <g id="vu-right">
            <line
                class="needle"
                x1="850"
                y1="174"
                x2="850"
                y2="88">
            </line>
            <circle
                class="pivot"
                cx="850"
                cy="174"
                r="5">
            </circle>
        </g>

    </svg>

    <div id="peak-left" class="peak-meter"></div>
    <div id="peak-right" class="peak-meter"></div>

    <div id="spectrum"></div>

</div>

<script>
(function () {
    "use strict";

    /* DJ LOGIN / LOGOUT */

    const params = new URLSearchParams(
        window.location.search
    );

    const djName = (
        params.get("dj") || ""
    ).trim().slice(0, 80);

    const isOnAir = djName.length > 0;

    const display = document.getElementById(
        "display"
    );

    const djElement = document.getElementById(
        "dj-name"
    );

    const airElement = document.getElementById(
        "air"
    );

    djElement.textContent = isOnAir
        ? djName
        : "DJ OFFLINE";

    airElement.textContent = isOnAir
        ? "ON AIR"
        : "OFF AIR";

    airElement.classList.toggle(
        "off",
        !isOnAir
    );

    /* VELICINA TEKSTA */

    function fitText(element, ratio) {
        let size = display.clientWidth * ratio;

        element.style.fontSize = size + "px";

        while (
            element.scrollWidth >
            element.clientWidth &&
            size > 10
        ) {
            size -= 1;
            element.style.fontSize =
                size + "px";
        }
    }

    function resizeText() {
        fitText(airElement, 0.046);
        fitText(djElement, 0.051);
    }

    window.addEventListener(
        "resize",
        resizeText
    );

    resizeText();

    /* PEAK METRI */

    function createPeakMeter(elementId) {
        const container = document.getElementById(
            elementId
        );

        const segments = [];

        for (let i = 0; i < 18; i++) {
            const segment = document.createElement(
                "span"
            );

            let color = "green";

            if (i >= 10 && i < 14) {
                color = "yellow";
            }

            if (i >= 14) {
                color = "red";
            }

            segment.className =
                "peak-segment " + color;

            container.appendChild(segment);
            segments.push(segment);
        }

        return segments;
    }

    const peakLeft = createPeakMeter(
        "peak-left"
    );

    const peakRight = createPeakMeter(
        "peak-right"
    );

    /* SPECTRUM */

    const spectrum = document.getElementById(
        "spectrum"
    );

    const spectrumBars = [];
    const spectrumCount = 36;

    for (let i = 0; i < spectrumCount; i++) {
        const bar = document.createElement(
            "div"
        );

        bar.className = "spectrum-bar";

        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }

    /* VU KAZALJKE */

    const vuLeft = document.getElementById(
        "vu-left"
    );

    const vuRight = document.getElementById(
        "vu-right"
    );

    let leftLevel = 0;
    let rightLevel = 0;
    let phase = 0;

    /* DEKORATIVNA ANIMACIJA */

    function updateLevel(current) {
        if (!isOnAir) {
            return 0;
        }

        const target =
            0.25 + Math.random() * 0.70;

        return current * 0.35 +
               target * 0.65;
    }

    function updatePeak(segments, level) {
        const activeCount = Math.round(
            level * segments.length
        );

        segments.forEach(function (
            segment,
            index
        ) {
            segment.classList.toggle(
                "active",
                index < activeCount
            );
        });
    }

    /* GLAVNA ANIMACIJA */

    function animate() {
        phase += 0.20;

        leftLevel = updateLevel(leftLevel);
        rightLevel = updateLevel(rightLevel);

        /* VU KAZALJKE */

        const leftAngle =
            -45 + leftLevel * 90;

        const rightAngle =
            -45 + rightLevel * 90;

        vuLeft.setAttribute(
            "transform",
            "rotate(" +
                leftAngle +
                " 150 174)"
        );

        vuRight.setAttribute(
            "transform",
            "rotate(" +
                rightAngle +
                " 850 174)"
        );

        /* PEAK L / R */

        updatePeak(
            peakLeft,
            leftLevel
        );

        updatePeak(
            peakRight,
            rightLevel
        );

        /* SPECTRUM */

        spectrumBars.forEach(function (
            bar,
            index
        ) {
            if (!isOnAir) {
                bar.style.height = "3%";
                return;
            }

            const middle =
                (spectrumCount - 1) / 2;

            const distance =
                Math.abs(index - middle) /
                middle;

            const centerShape =
                1 - distance * 0.62;

            const wave =
                0.56 +
                0.22 * Math.sin(
                    phase + index * 0.43
                ) +
                0.17 * Math.sin(
                    phase * 0.71 -
                    index * 0.35
                );

            const variation =
                Math.random() * 15;

            const height = Math.max(
                5,
                Math.min(
                    97,
                    centerShape * wave * 115 +
                    variation
                )
            );

            bar.style.height =
                height + "%";
        });
    }

    animate();

    setInterval(animate, 170);

})();
</script>

</body>
</html>
