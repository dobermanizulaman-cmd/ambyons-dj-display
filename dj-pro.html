
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#display {
    position: relative;
    width: min(100vw, 300vh);
    aspect-ratio: 3 / 1;
    flex: none;
    overflow: hidden;
    background: #080606 url("./display-bg.png")
        center / 100% 100% no-repeat;
    font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR / OFF AIR */

#air {
    position: absolute;
    left: 35%;
    top: 8%;
    width: 30%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    color: #fff1e8;
    font-weight: 900;
    letter-spacing: 0.03em;
    text-shadow:
        0 0 8px #ff2515,
        0 0 18px #b90000,
        2px 3px 2px #290000;
}

#air.off {
    color: #9b8c86;
    text-shadow: 2px 3px 3px #100808;
}

/* DJ IME */

#dj-name {
    position: absolute;
    left: 30%;
    top: 37%;
    width: 40%;
    height: 14%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    color: #eee7df;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    text-shadow:
        2px 2px 0 #503028,
        4px 4px 0 #100b09;
}

/* VU KAZALJKE */

#vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.needle {
    stroke: #ff3020;
    stroke-width: 4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #ff2515);
}

.pivot {
    fill: #34231c;
    stroke: #a58a75;
    stroke-width: 2;
}

/*
   PEAK L / PEAK R
   UKLOPLJENI U OCISCENE PROZORE
*/

.peak-meter {
    position: absolute;
    top: 79.6%;
    height: 11.5%;
    display: flex;
    align-items: stretch;
    gap: 0.25%;
    padding: 0.22%;
    overflow: hidden;
    background: #080a08;
    border: 1px solid #080806;
    border-radius: 2px;
    box-shadow:
        inset 0 2px 4px #000,
        inset 0 -2px 4px #000;
}

/* LEVI PEAK */

#peak-left {
    left: 2.6%;
    width: 19.9%;
}

/* DESNI PEAK */

#peak-right {
    left: 77%;
    width: 19.8%;
}

.peak-segment {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 1px solid #10120d;
    background: #101510;
    box-shadow:
        inset 1px 0 2px rgba(0,0,0,0.5),
        inset 0 2px 3px rgba(0,0,0,0.4);
}

.peak-segment.active.green {
    background: linear-gradient(
        180deg,
        #426c2b 0%,
        #4ba93b 30%,
        #23872a 65%,
        #163d18 100%
    );
    box-shadow:
        inset 0 3px 5px rgba(0,0,0,0.35),
        0 0 3px rgba(42,150,38,0.3);
}

.peak-segment.active.yellow {
    background: linear-gradient(
        180deg,
        #786329 0%,
        #c1a52f 30%,
        #a17b24 70%,
        #4b3818 100%
    );
    box-shadow:
        inset 0 3px 5px rgba(0,0,0,0.35),
        0 0 3px rgba(194,153,36,0.3);
}

.peak-segment.active.red {
    background: linear-gradient(
        180deg,
        #6a3026 0%,
        #b83d2b 30%,
        #882b20 70%,
        #401c17 100%
    );
    box-shadow:
        inset 0 3px 5px rgba(0,0,0,0.35),
        0 0 3px rgba(170,49,33,0.3);
}

/* PRLJAVO STAKLO */

.peak-meter::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
        radial-gradient(
            ellipse at 24% 42%,
            rgba(75,53,29,0.25),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 75% 70%,
            rgba(98,72,38,0.22),
            transparent 30%
        ),
        repeating-linear-gradient(
            112deg,
            transparent 0 13px,
            rgba(25,19,12,0.16) 14px,
            transparent 16px,
            transparent 29px
        ),
        linear-gradient(
            180deg,
            rgba(72,55,34,0.28),
            transparent 38%,
            rgba(25,17,12,0.16) 65%,
            rgba(0,0,0,0.38)
        );
}

/* PUKOTINE */

.peak-cracks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
    opacity: 0.65;
}

.peak-cracks path {
    fill: none;
    stroke: rgba(184,169,142,0.58);
    stroke-width: 0.7;
    stroke-linecap: round;
}

.peak-cracks .dark {
    stroke: rgba(19,14,10,0.8);
    stroke-width: 1.1;
}

/*
   SPECTRUM
   JEDAN RED ANIMIRANIH STUBICA.
   CRNA PODLOGA POKRIVA STATICKI SPECTRUM.
*/

#spectrum {
    position: absolute;
    left: 28.5%;
    top: 67%;
    width: 43%;
    height: 27.5%;
    display: flex;
    align-items: flex-end;
    gap: 0.45%;
    overflow: hidden;
    background: #070908;
    padding: 0.2%;
}

.spectrum-bar {
    flex: 1;
    min-width: 0;
    height: 3%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0 5px,
            #080808 5px 8px
        ),
        linear-gradient(
            to top,
            #0ce238 0%,
            #28e91d 33%,
            #f4e11d 55%,
            #ff9916 75%,
            #f52416 100%
        );
    transition: height 0.14s linear;
}
</style>
</head>

<body>

<div id="display">

    <div id="air" class="off">OFF AIR</div>
    <div id="dj-name">DJ OFFLINE</div>

    <!-- VU KAZALJKE -->

    <svg
        id="vu-overlay"
        viewBox="0 0 1000 333.333"
        preserveAspectRatio="none"
        aria-hidden="true">

        <g id="vu-left">
            <line
                class="needle"
                x1="150"
                y1="174"
                x2="150"
                y2="88">
            </line>
            <circle
                class="pivot"
                cx="150"
                cy="174"
                r="5">
            </circle>
        </g>

        <g id="vu-right">
            <line
                class="needle"
                x1="850"
                y1="174"
                x2="850"
                y2="88">
            </line>
            <circle
                class="pivot"
                cx="850"
                cy="174"
                r="5">
            </circle>
        </g>
    </svg>

    <!-- PEAK L -->

    <div id="peak-left" class="peak-meter">
        <svg class="peak-cracks"
             viewBox="0 0 300 50"
             preserveAspectRatio="none">
            <path d="M16 0 L28 12 L24 23 L38 32 L35 50"/>
            <path d="M24 23 L13 29 L7 40"/>
            <path class="dark"
                  d="M202 0 L195 13 L210 24 L204 37 L218 50"/>
            <path d="M210 24 L226 19 L235 9"/>
            <path d="M108 50 L115 35 L109 21 L120 8"/>
        </svg>
    </div>

    <!-- PEAK R -->

    <div id="peak-right" class="peak-meter">
        <svg class="peak-cracks"
             viewBox="0 0 300 50"
             preserveAspectRatio="none">
            <path d="M280 0 L268 12 L275 23 L260 35 L266 50"/>
            <path d="M275 23 L289 30 L295 42"/>
            <path class="dark"
                  d="M75 0 L85 15 L78 28 L92 40 L87 50"/>
            <path d="M78 28 L61 22 L55 11"/>
            <path d="M180 50 L172 35 L181 20 L170 5"/>
        </svg>
    </div>

    <!-- SPECTRUM -->

    <div id="spectrum"></div>

</div>

<script>
(function () {
    "use strict";

    /* DJ IME IZ URL-A */

    const params = new URLSearchParams(
        window.location.search
    );

    const djName = (
        params.get("dj") || ""
    ).trim().slice(0, 80);

    const isOnAir = djName.length > 0;

    const display = document.getElementById(
        "display"
    );

    const djElement = document.getElementById(
        "dj-name"
    );

    const airElement = document.getElementById(
        "air"
    );

    djElement.textContent = isOnAir
        ? djName
        : "DJ OFFLINE";

    airElement.textContent = isOnAir
        ? "ON AIR"
        : "OFF AIR";

    airElement.classList.toggle(
        "off",
        !isOnAir
    );

    /* VELICINA TEKSTA */

    function fitText(element, ratio) {
        let size = display.clientWidth * ratio;

        element.style.fontSize = size + "px";

        while (
            element.scrollWidth >
            element.clientWidth &&
            size > 10
        ) {
            size -= 1;
            element.style.fontSize =
                size + "px";
        }
    }

    function resizeText() {
        fitText(airElement, 0.046);
        fitText(djElement, 0.051);
    }

    window.addEventListener(
        "resize",
        resizeText
    );

    resizeText();

    /* PEAK METRI */

    function createPeakMeter(elementId) {
        const container = document.getElementById(
            elementId
        );

        const segments = [];

        for (let i = 0; i < 18; i++) {
            const segment = document.createElement(
                "span"
            );

            let color = "green";

            if (i >= 10 && i < 14) {
                color = "yellow";
            }

            if (i >= 14) {
                color = "red";
            }

            segment.className =
                "peak-segment " + color;

            container.appendChild(segment);
            segments.push(segment);
        }

        return segments;
    }

    const peakLeft = createPeakMeter(
        "peak-left"
    );

    const peakRight = createPeakMeter(
        "peak-right"
    );

    /* SPECTRUM */

    const spectrum = document.getElementById(
        "spectrum"
    );

    const spectrumBars = [];
    const spectrumCount = 36;

    for (let i = 0; i < spectrumCount; i++) {
        const bar = document.createElement(
            "div"
        );

        bar.className = "spectrum-bar";

        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }

    /* VU KAZALJKE */

    const vuLeft = document.getElementById(
        "vu-left"
    );

    const vuRight = document.getElementById(
        "vu-right"
    );

    let leftLevel = 0;
    let rightLevel = 0;
    let phase = 0;

    /* DEKORATIVNA ANIMACIJA */

    function updateLevel(current) {
        if (!isOnAir) {
            return 0;
        }

        const target =
            0.25 + Math.random() * 0.70;

        return current * 0.35 +
               target * 0.65;
    }

    function updatePeak(segments, level) {
        const activeCount = Math.round(
            level * segments.length
        );

        segments.forEach(function (
            segment,
            index
        ) {
            segment.classList.toggle(
                "active",
                index < activeCount
            );
        });
    }

    /* GLAVNA ANIMACIJA */

    function animate() {
        phase += 0.20;

        leftLevel = updateLevel(leftLevel);
        rightLevel = updateLevel(rightLevel);

        const leftAngle =
            -45 + leftLevel * 90;

        const rightAngle =
            -45 + rightLevel * 90;

        vuLeft.setAttribute(
            "transform",
            "rotate(" +
                leftAngle +
                " 150 174)"
        );

        vuRight.setAttribute(
            "transform",
            "rotate(" +
                rightAngle +
                " 850 174)"
        );

        updatePeak(
            peakLeft,
            leftLevel
        );

        updatePeak(
            peakRight,
            rightLevel
        );

        spectrumBars.forEach(function (
            bar,
            index
        ) {
            if (!isOnAir) {
                bar.style.height = "3%";
                return;
            }

            const middle =
                (spectrumCount - 1) / 2;

            const distance =
                Math.abs(index - middle) /
                middle;

            const centerShape =
                1 - distance * 0.62;

            const wave =
                0.56 +
                0.22 * Math.sin(
                    phase + index * 0.43
                ) +
                0.17 * Math.sin(
                    phase * 0.71 -
                    index * 0.35
                );

            const variation =
                Math.random() * 15;

            const height = Math.max(
                5,
                Math.min(
                    97,
                    centerShape * wave * 115 +
                    variation
                )
            );

            bar.style.height =
                height + "%";
        });
    }

    animate();
    setInterval(animate, 170);

})();
</script>

</body>
</html>
