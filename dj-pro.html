
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmbYonS DJ PRO — Industrial Display</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#e7d9c6;
  font-family:Impact,'Arial Narrow',Arial,sans-serif
}
:root{
  --red:#c82119;
  --edge:#57473d;
  --light:#d7c9b5
}
.display{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:24% 1fr 24%;
  gap:1.1%;
  padding:1%;
  background:radial-gradient(
    ellipse at 50% 50%,
    #201513 0%,#08090a 63%,#020202 100%
  )
}
.side{
  display:grid;
  grid-template-rows:minmax(0,1fr) 24%;
  gap:3%;
  min-height:0
}
.center{
  display:grid;
  grid-template-rows:43% minmax(0,1fr);
  gap:3%;
  min-height:0
}
.instrument{
  min-height:0;
  position:relative;
  border:3px solid #3b3330;
  border-radius:5px;
  background:linear-gradient(
    135deg,#1c1c1a,#070809 55%,#171310
  );
  box-shadow:
    inset 0 0 0 1px #796253,
    inset 0 0 25px #000,
    0 0 9px #000;
  overflow:hidden
}
.instrument:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    115deg,
    transparent 0 29px,
    #d8b8a407 30px 31px,
    transparent 32px 64px
  )
}
.vu{
  display:flex;
  flex-direction:column;
  padding:3% 3% 2%;
  background:linear-gradient(
    150deg,#ad9164,#b69b6e 38%,#67533c 100%
  );
  box-shadow:
    inset 0 0 0 2px #211b18,
    inset 0 0 28px #20140b
}
.vu-label{
  font-size:clamp(11px,1.6vw,29px);
  text-align:center;
  letter-spacing:.13em;
  color:#2c211b;
  text-shadow:0 1px #d4b88a
}
.gauge{
  position:relative;
  flex:1;
  min-height:0
}
.gauge svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible
}
.arc{
  fill:none;
  stroke:#261a13;
  stroke-width:2.8
}
.tick{
  stroke:#241911;
  stroke-width:2.4
}
.scale-text{
  fill:#281b15;
  font:700 13px Arial,sans-serif
}
.danger{fill:#b91610}
.needle{
  stroke:#e41b18;
  stroke-width:3.6;
  stroke-linecap:round;
  filter:drop-shadow(0 0 2px #f32018);
  transform-origin:150px 157px;
  transform:rotate(-42deg);
  transition:transform .15s ease-out
}
.hub{
  fill:#b9ae9d;
  stroke:#392a24;
  stroke-width:4
}
.vu-word{
  fill:#271a13;
  font:700 32px Georgia,serif;
  text-anchor:middle
}
.peak{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:13%;
  padding:5% 6%;
  background:linear-gradient(#1b1816,#080909)
}
.peak-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:clamp(10px,1.55vw,26px);
  letter-spacing:.08em
}
.lamp{
  width:12px;
  height:12px;
  border:1px solid #aa2119;
  border-radius:50%;
  background:#430b09
}
.lamp.hot{
  background:#ff2517;
  box-shadow:0 0 10px #ff2517
}
.peak-track{
  height:35%;
  display:flex;
  gap:2px
}
.segment{
  flex:1;
  min-width:0;
  background:#20221f;
  border:1px solid #151817
}
.segment.on.green{
  background:#00d54c;
  box-shadow:0 0 4px #00c742
}
.segment.on.yellow{
  background:#efca18;
  box-shadow:0 0 4px #efca18
}
.segment.on.red{
  background:#f22b1b;
  box-shadow:0 0 5px #f22b1b
}
.identity{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6%;
  padding:2%;
  background:radial-gradient(
    ellipse,#2b1311,#080808 72%
  )
}
.air{
  font-size:clamp(14px,2.3vw,43px);
  font-weight:900;
  letter-spacing:.2em;
  color:#ff352b;
  text-shadow:
    0 0 8px #c01c14,
    0 0 20px #9d130f
}
.air.off{
  color:#99908b;
  text-shadow:none
}
.dj{
  max-width:100%;
  font-size:clamp(18px,4vw,75px);
  font-style:italic;
  letter-spacing:.035em;
  text-align:center;
  line-height:1.05;
  overflow-wrap:anywhere;
  text-shadow:
    2px 3px 0 #4d2924,
    0 0 9px #7b3a2a
}
.sub{
  font:700 clamp(8px,1vw,18px) Arial,sans-serif;
  letter-spacing:.16em;
  color:#bb4937;
  text-align:center
}
.spectrum-panel{
  display:flex;
  flex-direction:column;
  padding:2% 3% 2%;
  background:repeating-linear-gradient(
    0deg,#0a0c0b 0 12px,#171715 13px 14px
  )
}
.spectrum-label{
  flex:none;
  text-align:center;
  color:#c8b49b;
  font-size:clamp(10px,1.15vw,22px);
  letter-spacing:.12em;
  padding-bottom:2%
}
.spectrum{
  display:flex;
  align-items:flex-end;
  gap:1.2%;
  flex:1;
  min-height:0
}
.bar{
  flex:1;
  min-width:0;
  height:15%;
  background:
    repeating-linear-gradient(
      to top,
      transparent 0 3px,
      #050505 4px 6px
    ),
    linear-gradient(
      to top,
      #08d54c 0%,
      #7bdf16 35%,
      #f4d321 63%,
      #ed6511 80%,
      #ed211a 100%
    );
  transition:height .13s linear
}
@media(max-width:650px){
  .display{padding:.5%;gap:.7%}
  .instrument{border-width:2px}
  .peak-track{gap:1px}
  .lamp{width:7px;height:7px}
  .vu-label{font-size:10px}
  .peak-head{font-size:9px}
  .spectrum-label{font-size:9px}
  .sub{font-size:7px}
}
@media(prefers-reduced-motion:reduce){
  .bar,.needle{transition:none}
}
</style>
</head>
<body>

<main class="display" aria-label="DJ PRO display">

  <!-- LEFT VU + PEAK -->
  <section class="side">
    <div class="instrument vu">
      <div class="vu-label">VU LEFT</div>
      <div class="gauge">
        <svg viewBox="0 0 300 175"
             preserveAspectRatio="xMidYMid meet"
             aria-hidden="true">
          <path class="arc"
                d="M18 135 Q150 -70 282 135"/>
          <path class="tick"
                d="M18 135l-9 4 M43 94l-9 -7
                   M79 60l-6 -10 M114 41l-3 -11
                   M150 35v-12 M186 41l3 -11
                   M221 60l6 -10 M257 94l9 -7
                   M282 135l9 4"/>
          <text class="scale-text" x="5" y="159">-20</text>
          <text class="scale-text" x="29" y="82">-10</text>
          <text class="scale-text" x="86" y="34">-5</text>
          <text class="scale-text" x="146" y="17">0</text>
          <text class="scale-text danger" x="207" y="34">+3</text>
          <text class="scale-text danger" x="265" y="82">+6</text>
          <text class="vu-word" x="150" y="116">VU</text>
          <line id="needleL" class="needle"
                x1="150" y1="157" x2="150" y2="46"/>
          <circle class="hub" cx="150" cy="157" r="7"/>
        </svg>
      </div>
    </div>

    <div class="instrument peak">
      <div class="peak-head">
        PEAK L
        <span id="lampL" class="lamp"></span>
      </div>
      <div id="peakL" class="peak-track"></div>
    </div>
  </section>

  <!-- CENTER: ON AIR / DJ / SPECTRUM -->
  <section class="center">
    <div class="instrument identity">
      <div id="air" class="air off">OFF AIR</div>
      <div id="dj" class="dj">DJ OFFLINE</div>
      <div id="sub" class="sub">NO DJ ONLINE</div>
    </div>

    <div class="instrument spectrum-panel">
      <div class="spectrum-label">
        ACID · HARD TECHNO · SCHRANZ
      </div>
      <div id="spectrum"
           class="spectrum"
           aria-hidden="true"></div>
    </div>
  </section>

  <!-- RIGHT VU + PEAK -->
  <section class="side">
    <div class="instrument vu">
      <div class="vu-label">VU RIGHT</div>
      <div class="gauge">
        <svg viewBox="0 0 300 175"
             preserveAspectRatio="xMidYMid meet"
             aria-hidden="true">
          <path class="arc"
                d="M18 135 Q150 -70 282 135"/>
          <path class="tick"
                d="M18 135l-9 4 M43 94l-9 -7
                   M79 60l-6 -10 M114 41l-3 -11
                   M150 35v-12 M186 41l3 -11
                   M221 60l6 -10 M257 94l9 -7
                   M282 135l9 4"/>
          <text class="scale-text" x="5" y="159">-20</text>
          <text class="scale-text" x="29" y="82">-10</text>
          <text class="scale-text" x="86" y="34">-5</text>
          <text class="scale-text" x="146" y="17">0</text>
          <text class="scale-text danger" x="207" y="34">+3</text>
          <text class="scale-text danger" x="265" y="82">+6</text>
          <text class="vu-word" x="150" y="116">VU</text>
          <line id="needleR" class="needle"
                x1="150" y1="157" x2="150" y2="46"/>
          <circle class="hub" cx="150" cy="157" r="7"/>
        </svg>
      </div>
    </div>

    <div class="instrument peak">
      <div class="peak-head">
        PEAK R
        <span id="lampR" class="lamp"></span>
      </div>
      <div id="peakR" class="peak-track"></div>
    </div>
  </section>

</main>

<script>
(() => {
  'use strict';

  // DJ name comes from BOARD URL:
  // dj-pro.html?dj=DJ%20ZULAMAN

  const name = (
    new URLSearchParams(location.search).get('dj') || ''
  ).trim().slice(0, 80);

  const active = name.length > 0;

  document.getElementById('dj').textContent =
    active ? name : 'DJ OFFLINE';

  document.getElementById('air').textContent =
    active ? 'ON AIR' : 'OFF AIR';

  document.getElementById('air')
    .classList.toggle('off', !active);

  document.getElementById('sub').textContent =
    active
      ? 'LIVE UNDERGROUND TRANSMISSION'
      : 'NO DJ ONLINE';

  const count = 22;

  function makePeak(id) {
    const root = document.getElementById(id);

    return Array.from({length: count}, (_, i) => {
      const el = document.createElement('span');

      el.className = 'segment ' +
        (i < 14 ? 'green' : i < 18 ? 'yellow' : 'red');

      root.appendChild(el);
      return el;
    });
  }

  const peaks = [
    makePeak('peakL'),
    makePeak('peakR')
  ];

  const spectrum = document.getElementById('spectrum');

  const bars = Array.from({length: 28}, () => {
    const el = document.createElement('div');
    el.className = 'bar';
    spectrum.appendChild(el);
    return el;
  });

  let tick = 0;

  function draw() {
    tick += .19;

    const values = [0, 0];

    for (let c = 0; c < 2; c++) {
      values[c] = active
        ? .3 + Math.random() * .66
        : 0;

      document.getElementById(
        c ? 'needleR' : 'needleL'
      ).style.transform =
        'rotate(' + (-43 + values[c] * 85) + 'deg)';

      const n = Math.round(values[c] * count);

      peaks[c].forEach((el, i) =>
        el.classList.toggle('on', i < n)
      );

      document.getElementById(
        c ? 'lampR' : 'lampL'
      ).classList.toggle('hot', n >= 19);
    }

    bars.forEach((el, i) => {
      const wave = (
        Math.sin(i * .43 + tick) +
        Math.sin(i * .19 - tick * .66) +
        2
      ) / 4;

      const h = active
        ? 12 + 70 * wave *
          (.35 + .65 * Math.random())
        : 3;

      el.style.height =
        Math.min(96, h) + '%';
    });
  }

  draw();
  setInterval(draw, 170);
})();
</script>

</body>
</html>
