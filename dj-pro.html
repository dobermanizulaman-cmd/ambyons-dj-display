
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#display {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #080606;
    background-image: url("./display-bg.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR / OFF AIR */

#air {
    position: absolute;
    left: 36%;
    top: 7%;
    width: 28%;
    height: 15%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 4.3vw, 88px);
    font-weight: 900;
    letter-spacing: 0.05em;
    white-space: nowrap;
    color: #f5e8dc;
    text-shadow:
        2px 3px 2px #350600,
        0 0 12px #ff2416,
        0 0 25px #b80000;
}

#air.off {
    color: #a69a90;
    text-shadow: 2px 3px 3px #080505;
}

/* DJ NAME */

#dj-name {
    position: absolute;
    left: 29%;
    top: 34%;
    width: 42%;
    height: 20%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 1%;
    overflow: hidden;
    white-space: nowrap;
    color: #e9e2d8;
    font-size: clamp(16px, 4.5vw, 94px);
    font-weight: 900;
    font-style: italic;
    text-align: center;
    line-height: 1;
    text-shadow:
        2px 2px 0 #4d3028,
        4px 4px 0 #160d0b,
        0 0 12px #762b1d;
}

/* VU NEEDLES */

#vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.needle {
    stroke: #ff291d;
    stroke-width: 5;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px #c81910);
}

.pivot {
    fill: #30231d;
    stroke: #b39b82;
    stroke-width: 3;
}

/* PEAK METERS */

.peak-meter {
    position: absolute;
    top: 80%;
    height: 7%;
    display: flex;
    align-items: stretch;
    gap: 1%;
    overflow: hidden;
}

#peak-left {
    left: 4%;
    width: 19%;
}

#peak-right {
    left: 77%;
    width: 19%;
}

.peak-segment {
    flex: 1;
    min-width: 0;
    background: #121712;
    border: 1px solid #090909;
}

.peak-segment.active.green {
    background: #11d83b;
    box-shadow: 0 0 5px #11d83b;
}

.peak-segment.active.yellow {
    background: #ffe221;
    box-shadow: 0 0 5px #ffe221;
}

.peak-segment.active.red {
    background: #ff2818;
    box-shadow: 0 0 6px #ff2818;
}

/* PEAK RED LIGHTS */

.peak-light {
    position: absolute;
    top: 70%;
    width: 2%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #420d09;
    border: 1px solid #672a20;
}

#light-left {
    left: 20%;
}

#light-right {
    left: 91%;
}

.peak-light.active {
    background: #ff2919;
    box-shadow:
        0 0 9px #ff2919,
        0 0 19px #b60000;
}

/* SPECTRUM BELOW DJ NAME */

#spectrum {
    position: absolute;
    left: 29%;
    top: 64%;
    width: 42%;
    height: 27%;
    display: flex;
    align-items: flex-end;
    gap: 0.5%;
    overflow: hidden;
}

.spectrum-bar {
    flex: 1;
    min-width: 0;
    height: 3%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0 5px,
            #080808 5px 8px
        ),
        linear-gradient(
            to top,
            #0ce238 0%,
            #28e91d 33%,
            #f4e11d 55%,
            #ff9916 75%,
            #f52416 100%
        );
    filter: drop-shadow(0 0 2px #437d1c);
    transition: height 0.14s linear;
}

@media (prefers-reduced-motion: reduce) {
    .spectrum-bar {
        transition: none;
    }
}
</style>
</head>

<body>

<div id="display">

    <!-- ON AIR / OFF AIR -->
    <div id="air" class="off">OFF AIR</div>

    <!-- DJ NAME -->
    <div id="dj-name">DJ OFFLINE</div>

    <!-- VU METERS -->
    <svg
        id="vu-overlay"
        viewBox="0 0 1000 500"
        preserveAspectRatio="none"
        aria-hidden="true">

        <g id="vu-left">
            <line
                class="needle"
                x1="150"
                y1="245"
                x2="150"
                y2="130">
            </line>
            <circle
                class="pivot"
                cx="150"
                cy="245"
                r="5">
            </circle>
        </g>

        <g id="vu-right">
            <line
                class="needle"
                x1="850"
                y1="245"
                x2="850"
                y2="130">
            </line>
            <circle
                class="pivot"
                cx="850"
                cy="245"
                r="5">
            </circle>
        </g>

    </svg>

    <!-- PEAK LEFT -->
    <div id="peak-left" class="peak-meter"></div>
    <div id="light-left" class="peak-light"></div>

    <!-- PEAK RIGHT -->
    <div id="peak-right" class="peak-meter"></div>
    <div id="light-right" class="peak-light"></div>

    <!-- SPECTRUM -->
    <div id="spectrum"></div>

</div>

<script>
(function () {
    "use strict";

    /*
       DJ NAME FROM URL

       Example:
       dj-pro.html?dj=DJ%20ZULAMAN

       Empty DJ parameter = OFF AIR
    */

    const params = new URLSearchParams(
        window.location.search
    );

    const djName = (
        params.get("dj") || ""
    ).trim().slice(0, 80);

    const isOnAir = djName.length > 0;

    const djElement = document.getElementById(
        "dj-name"
    );

    const airElement = document.getElementById(
        "air"
    );

    djElement.textContent = isOnAir
        ? djName
        : "DJ OFFLINE";

    airElement.textContent = isOnAir
        ? "ON AIR"
        : "OFF AIR";

    airElement.classList.toggle(
        "off",
        !isOnAir
    );

    /*
       FIT LONG DJ NAMES
    */

    function fitDJName() {
        let size = 94;

        djElement.style.fontSize = size + "px";

        while (
            djElement.scrollWidth >
            djElement.clientWidth &&
            size > 16
        ) {
            size -= 2;
            djElement.style.fontSize = size + "px";
        }
    }

    fitDJName();

    /*
       CREATE PEAK LED SEGMENTS
    */

    function createPeakMeter(elementId) {
        const container = document.getElementById(
            elementId
        );

        const segments = [];

        for (let i = 0; i < 18; i++) {
            const segment = document.createElement(
                "span"
            );

            let color = "green";

            if (i >= 10 && i < 14) {
                color = "yellow";
            }

            if (i >= 14) {
                color = "red";
            }

            segment.className =
                "peak-segment " + color;

            container.appendChild(segment);
            segments.push(segment);
        }

        return segments;
    }

    const peakLeft = createPeakMeter(
        "peak-left"
    );

    const peakRight = createPeakMeter(
        "peak-right"
    );

    /*
       CREATE SPECTRUM BARS
    */

    const spectrum = document.getElementById(
        "spectrum"
    );

    const spectrumBars = [];
    const spectrumCount = 36;

    for (let i = 0; i < spectrumCount; i++) {
        const bar = document.createElement("div");

        bar.className = "spectrum-bar";

        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }

    /*
       VU METER ELEMENTS
    */

    const vuLeft = document.getElementById(
        "vu-left"
    );

    const vuRight = document.getElementById(
        "vu-right"
    );

    const lightLeft = document.getElementById(
        "light-left"
    );

    const lightRight = document.getElementById(
        "light-right"
    );

    /*
       SMOOTH SIMULATED LEVELS

       These animations are visual.
       Browser MOAP does not automatically
       provide real parcel audio levels.
    */

    let leftLevel = 0;
    let rightLevel = 0;
    let phase = 0;

    function updateLevel(current) {
        if (!isOnAir) {
            return 0;
        }

        const target =
            0.25 + Math.random() * 0.70;

        return current * 0.35 +
               target * 0.65;
    }

    /*
       UPDATE PEAK LEDS
    */

    function updatePeak(segments, level) {
        const activeCount = Math.round(
            level * segments.length
        );

        segments.forEach(function (
            segment,
            index
        ) {
            segment.classList.toggle(
                "active",
                index < activeCount
            );
        });

        return activeCount;
    }

    /*
       MAIN ANIMATION
    */

    function animate() {
        phase += 0.20;

        leftLevel = updateLevel(leftLevel);
        rightLevel = updateLevel(rightLevel);

        /*
           VU NEEDLES
        */

        const leftAngle =
            -45 + leftLevel * 90;

        const rightAngle =
            -45 + rightLevel * 90;

        vuLeft.setAttribute(
            "transform",
            "rotate(" +
                leftAngle +
                " 150 245)"
        );

        vuRight.setAttribute(
            "transform",
            "rotate(" +
                rightAngle +
                " 850 245)"
        );

        /*
           PEAK LEDS
        */

        const leftPeakCount = updatePeak(
            peakLeft,
            leftLevel
        );

        const rightPeakCount = updatePeak(
            peakRight,
            rightLevel
        );

        /*
           PEAK WARNING LIGHTS
        */

        lightLeft.classList.toggle(
            "active",
            leftPeakCount >= 15
        );

        lightRight.classList.toggle(
            "active",
            rightPeakCount >= 15
        );

        /*
           SPECTRUM
        */

        spectrumBars.forEach(function (
            bar,
            index
        ) {
            if (!isOnAir) {
                bar.style.height = "3%";
                return;
            }

            const middle =
                (spectrumCount - 1) / 2;

            const distance =
                Math.abs(index - middle) /
                middle;

            const centerShape =
                1 - distance * 0.62;

            const wave =
                0.56 +
                0.22 * Math.sin(
                    phase + index * 0.43
                ) +
                0.17 * Math.sin(
                    phase * 0.71 -
                    index * 0.35
                );

            const variation =
                Math.random() * 15;

            const height = Math.max(
                5,
                Math.min(
                    97,
                    centerShape *
                    wave *
                    115 +
                    variation
                )
            );

            bar.style.height =
                height + "%";
        });
    }

    /*
       START DISPLAY
    */

    animate();

    setInterval(
        animate,
        170
    );

})();
</script>

</body>
</html>
