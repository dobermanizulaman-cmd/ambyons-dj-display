
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmbYonS — Industrial DJ Display</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#000;color:#e9dfd2;
 font-family:Impact,'Arial Narrow',Arial,sans-serif
}
:root{
 --rust:#8e4220;
 --steel:#51453c;
 --red:#e52218
}
.screen{
 position:absolute;inset:0;display:grid;
 grid-template-columns:25% minmax(0,1fr) 25%;
 gap:1.2%;padding:1.2%;
 background:radial-gradient(ellipse at 50% 50%,
 #211715 0%,#090909 65%,#020202 100%)
}
.side{
 display:grid;
 grid-template-rows:minmax(0,1fr) 23%;
 gap:3%;min-height:0
}
.middle{
 display:grid;
 grid-template-rows:19% 31% minmax(0,1fr);
 gap:2%;min-height:0;min-width:0
}
.metal{
 position:relative;min-height:0;overflow:hidden;
 border:4px ridge #655449;
 box-shadow:inset 0 0 0 2px #130f0c,
 0 0 0 2px #130c0a,0 5px 12px #000;
 border-radius:8px;
 background:repeating-linear-gradient(
 125deg,#1b1715 0 14px,#251b17 16px,#120f0d 28px)
}
.metal:after{
 content:"";position:absolute;inset:0;
 pointer-events:none;opacity:.25;
 background:repeating-linear-gradient(
 104deg,transparent 0 22px,
 #bb693b22 23px 24px,transparent 25px 47px)
}
.bolt{
 position:absolute;width:13px;height:13px;
 border-radius:50%;
 background:radial-gradient(circle at 35% 25%,
 #a4947d,#493b30 55%,#100d0a 78%);
 border:1px solid #15110d;z-index:4;
 box-shadow:0 1px 2px #000
}
.tl{top:6px;left:6px}
.tr{top:6px;right:6px}
.bl{bottom:6px;left:6px}
.br{bottom:6px;right:6px}

.vu{
 padding:5% 5% 4%;display:flex;
 flex-direction:column;
 background:linear-gradient(145deg,#281c17,#100d0c)
}
.vu-window{
 position:relative;flex:1;min-height:0;
 border:3px solid #27140b;
 border-radius:42% 42% 12px 12px / 16% 16% 12px 12px;
 overflow:hidden;
 background:radial-gradient(ellipse at 50% 78%,
 #e3b96b 0%,#b88943 48%,#50341c 92%);
 box-shadow:inset 0 0 18px #1b0e08,
 inset 0 0 0 3px #9a6c3d
}
.vu-window:before{
 content:"";position:absolute;inset:0;z-index:1;
 pointer-events:none;
 background:repeating-linear-gradient(
 145deg,transparent 0 26px,
 #30160816 27px 28px,transparent 29px 59px),
 radial-gradient(circle at 25% 75%,#1e100d4d,transparent 48%)
}
.vu svg{
 width:100%;height:100%;
 position:absolute;inset:0;overflow:visible
}
.scale{stroke:#21140e;stroke-width:2.6;fill:none}
.scale-red{stroke:#bb1b10;stroke-width:4;fill:none}
.tick{stroke:#24130c;stroke-width:2.8}
.tick-red{stroke:#d01910;stroke-width:3}
.numbers{font:700 15px Arial,sans-serif;fill:#1c110d}
.numbers.red{fill:#b50e0b}
.vu-text{
 font:900 38px Impact,Arial,sans-serif;
 fill:#20140d;text-anchor:middle
}
.needle{
 stroke:#ff2c1c;stroke-width:4;stroke-linecap:round;
 filter:drop-shadow(0 0 3px #f42b17);
 transform-origin:150px 172px;
 transform:rotate(-42deg);
 transition:transform .16s ease-out
}
.pivot{
 fill:#332820;stroke:#b9a18a;stroke-width:4
}

.peak{
 padding:7% 6% 6%;display:flex;
 flex-direction:column;
 justify-content:space-around;gap:7%;
 background:linear-gradient(155deg,#251916,#090909 75%)
}
.peak-top{
 display:flex;justify-content:space-between;
 align-items:center;gap:5px;
 font-size:clamp(12px,2vw,34px);
 letter-spacing:.045em;text-shadow:1px 2px #000
}
.lamp{
 width:clamp(11px,2.1vw,28px);
 height:clamp(11px,2.1vw,28px);
 flex:none;border-radius:50%;
 background:#490d09;border:2px solid #6d3a2b;
 box-shadow:inset 0 0 5px #100;
 transition:background .12s
}
.lamp.lit{
 background:#ff2618;
 box-shadow:0 0 12px #e32617,0 0 24px #a91810
}
.leds{
 display:flex;gap:1.1%;
 height:38%;min-height:7px
}
.led{
 flex:1;min-width:0;background:#151917;
 border:1px solid #0a0a0a
}
.led.on.g{
 background:#04d632;box-shadow:0 0 5px #00c63d
}
.led.on.y{
 background:#ffe51c;box-shadow:0 0 5px #ffd81b
}
.led.on.r{
 background:#fa2d14;box-shadow:0 0 6px #fa2414
}

.air-outer{
 display:flex;align-items:center;
 justify-content:center;min-height:0
}
.air-plaque{
 width:72%;height:87%;
 display:flex;align-items:center;justify-content:center;
 border:4px ridge #705144;
 clip-path:polygon(5% 0,95% 0,100% 30%,
 100% 70%,95% 100%,5% 100%,0 70%,0 30%);
 background:linear-gradient(
 130deg,#6c150d,#a01c12 40%,#310b0a 100%);
 box-shadow:inset 0 0 18px #170504
}
.air-text{
 font-size:clamp(18px,4.5vw,78px);
 letter-spacing:.09em;color:#f0e4d6;
 text-shadow:2px 3px #4a100b,0 0 12px #ff4d32
}
.air-text.off{
 color:#a79c92;text-shadow:2px 3px #1c1311
}
.identity{
 min-height:0;display:flex;
 align-items:center;justify-content:center;
 position:relative;overflow:hidden;
 background:radial-gradient(ellipse at center,
 #301411 0%,#0c0b0b 70%);
 border-top:2px solid #7d271c;
 border-bottom:2px solid #7d271c
}
.identity:before{
 content:"";position:absolute;
 width:34%;aspect-ratio:1;
 border:13px solid #9e160f;opacity:.5;
 transform:rotate(30deg);
 clip-path:polygon(50% 0,100% 25%,100% 75%,
 50% 100%,0 75%,0 25%)
}
.djname{
 position:relative;z-index:1;width:100%;
 padding:0 3%;text-align:center;
 font-size:clamp(22px,5vw,90px);
 font-style:italic;letter-spacing:.02em;
 line-height:1.05;overflow-wrap:anywhere;
 color:#e6dcd1;
 text-shadow:3px 4px #3c211c,0 0 14px #8b3322
}
.spectrum-wrap{
 min-height:0;position:relative;
 display:flex;flex-direction:column;
 justify-content:flex-end;
 padding:2% 1.5% 1.5%;
 background:linear-gradient(180deg,#100e0e,#080909)
}
.spectrum{
 display:flex;align-items:flex-end;
 gap:.65%;width:100%;height:100%;min-height:0
}
.bar{
 flex:1;min-width:0;height:5%;
 background:repeating-linear-gradient(
 to top,transparent 0 5px,#050606 5px 8px),
 linear-gradient(to top,#0bd82b 0%,
 #20df18 34%,#f7df17 53%,
 #ff9914 72%,#ff1e13 100%);
 filter:drop-shadow(0 0 2px #1b701a);
 transition:height .15s linear
}
@media(max-width:650px){
 .screen{padding:.6%;gap:.6%}
 .metal{border-width:2px;border-radius:4px}
 .bolt{width:6px;height:6px}
 .vu{padding:3%}
 .vu-window{border-width:2px}
 .peak{padding:4%}
 .peak-top{font-size:10px}
 .air-plaque{border-width:2px}
 .identity:before{border-width:5px}
}
@media(prefers-reduced-motion:reduce){
 .needle,.bar{transition:none}
}
</style>
</head>
<body>

<main class="screen">

 <section class="side">
  <div class="metal vu">
   <i class="bolt tl"></i><i class="bolt tr"></i>
   <i class="bolt bl"></i><i class="bolt br"></i>
   <div class="vu-window">
    <svg viewBox="0 0 300 200"
         preserveAspectRatio="xMidYMid meet"
         aria-label="Left analog VU meter">
     <path class="scale" d="M20 140 Q150 -43 280 140"/>
     <path class="scale-red" d="M150 14 Q223 18 280 140"/>
     <g class="tick">
      <path d="M20 140l-11 6 M42 96l-11 -8
       M74 57l-7 -11 M111 30l-4 -12
       M150 20v-13 M189 30l4 -12
       M226 57l7 -11 M258 96l11 -8
       M280 140l11 6"/>
     </g>
     <g class="numbers">
      <text x="4" y="165">-20</text>
      <text x="24" y="84">-10</text>
      <text x="69" y="42">-5</text>
      <text x="106" y="17">-3</text>
      <text x="143" y="10">0</text>
      <text class="numbers red" x="187" y="17">+3</text>
      <text class="numbers red" x="250" y="84">+6</text>
     </g>
     <text class="vu-text" x="150" y="119">VU</text>
     <line id="needleL" class="needle"
           x1="150" y1="172" x2="150" y2="34"/>
     <circle class="pivot" cx="150" cy="172" r="8"/>
    </svg>
   </div>
  </div>

  <div class="metal peak">
   <i class="bolt tl"></i><i class="bolt tr"></i>
   <div class="peak-top">
    PEAK L <span id="lampL" class="lamp"></span>
   </div>
   <div id="peakL" class="leds"></div>
  </div>
 </section>

 <section class="middle">
  <div class="air-outer">
   <div class="air-plaque">
    <span id="air" class="air-text off">OFF AIR</span>
   </div>
  </div>

  <div class="identity">
   <div id="dj" class="djname">DJ OFFLINE</div>
  </div>

  <div class="spectrum-wrap">
   <div id="spectrum" class="spectrum"
        aria-label="Animated decorative spectrum"></div>
  </div>
 </section>

 <section class="side">
  <div class="metal vu">
   <i class="bolt tl"></i><i class="bolt tr"></i>
   <i class="bolt bl"></i><i class="bolt br"></i>
   <div class="vu-window">
    <svg viewBox="0 0 300 200"
         preserveAspectRatio="xMidYMid meet"
         aria-label="Right analog VU meter">
     <path class="scale" d="M20 140 Q150 -43 280 140"/>
     <path class="scale-red" d="M150 14 Q223 18 280 140"/>
     <g class="tick">
      <path d="M20 140l-11 6 M42 96l-11 -8
       M74 57l-7 -11 M111 30l-4 -12
       M150 20v-13 M189 30l4 -12
       M226 57l7 -11 M258 96l11 -8
       M280 140l11 6"/>
     </g>
     <g class="numbers">
      <text x="4" y="165">-20</text>
      <text x="24" y="84">-10</text>
      <text x="69" y="42">-5</text>
      <text x="106" y="17">-3</text>
      <text x="143" y="10">0</text>
      <text class="numbers red" x="187" y="17">+3</text>
      <text class="numbers red" x="250" y="84">+6</text>
     </g>
     <text class="vu-text" x="150" y="119">VU</text>
     <line id="needleR" class="needle"
           x1="150" y1="172" x2="150" y2="34"/>
     <circle class="pivot" cx="150" cy="172" r="8"/>
    </svg>
   </div>
  </div>

  <div class="metal peak">
   <i class="bolt tl"></i><i class="bolt tr"></i>
   <div class="peak-top">
    PEAK R <span id="lampR" class="lamp"></span>
   </div>
   <div id="peakR" class="leds"></div>
  </div>
 </section>

</main>

<script>
(function(){
 'use strict';

 var params=new URLSearchParams(window.location.search);
 var name=(params.get('dj')||'').trim().slice(0,80);
 var active=!!name;

 document.getElementById('air').textContent=
  active?'ON AIR':'OFF AIR';

 document.getElementById('air').className=
  'air-text'+(active?'':' off');

 document.getElementById('dj').textContent=
  active?name:'DJ OFFLINE';

 function createLeds(id){
  var p=document.getElementById(id),a=[];
  for(var i=0;i<18;i++){
   var s=document.createElement('span');
   s.className='led '+(i<10?'g':i<14?'y':'r');
   p.appendChild(s);
   a.push(s);
  }
  return a;
 }

 var leds=[
  createLeds('peakL'),
  createLeds('peakR')
 ];

 var root=document.getElementById('spectrum'),bars=[];

 for(var j=0;j<35;j++){
  var b=document.createElement('div');
  b.className='bar';
  root.appendChild(b);
  bars.push(b);
 }

 var phase=0;

 function update(){
  phase+=.17;

  for(var c=0;c<2;c++){
   var level=active?.28+Math.random()*.70:0;

   document.getElementById(
    c?'needleR':'needleL'
   ).style.transform=
    'rotate('+(-42+level*84)+'deg)';

   var lit=Math.round(level*18);

   leds[c].forEach(function(e,i){
    e.classList.toggle('on',i<lit);
   });

   document.getElementById(
    c?'lampR':'lampL'
   ).classList.toggle('lit',lit>=15);
  }

  bars.forEach(function(b,i){
   var distance=
    Math.abs(i-(bars.length-1)/2)/
    ((bars.length-1)/2);

   var center=1-.63*distance;

   var motion=
    .55+
    .23*Math.sin(phase+i*.48)+
    .22*Math.sin(phase*.7-i*.39);

   var h=active
    ?Math.max(8,Math.min(97,
      center*motion*120+Math.random()*14))
    :3;

   b.style.height=h+'%';
  });
 }

 update();
 setInterval(update,170);
})();
</script>
</body>
</html>
