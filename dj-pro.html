
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#display {
    position: relative;
    width: min(100vw, 300vh);
    aspect-ratio: 3 / 1;
    flex: none;
    overflow: hidden;
    background: #080606 url("./display-bg.png")
        center / 100% 100% no-repeat;
    font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR / OFF AIR */

#air {
    position: absolute;
    left: 35%;
    top: 8%;
    width: 30%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    color: #fff1e8;
    font-weight: 900;
    letter-spacing: .03em;
    text-shadow:
        0 0 8px #ff2515,
        0 0 18px #b90000,
        2px 3px 2px #290000;
}

#air.off {
    color: #9b8c86;
    text-shadow: 2px 3px 3px #100808;
}

/* DJ IME */

#dj-name {
    position: absolute;
    left: 30%;
    top: 37%;
    width: 40%;
    height: 14%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    color: #eee7df;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    text-shadow:
        2px 2px 0 #503028,
        4px 4px 0 #100b09;
}

/* VU KAZALJKE */

#vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.needle {
    stroke: #ff3020;
    stroke-width: 4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #ff2515);
}

.pivot {
    fill: #34231c;
    stroke: #a58a75;
    stroke-width: 2;
}

/*
 PEAK METRI
 Pozicije prema crnim otvorima na slici.
*/

.peak-meter {
    position: absolute;
    top: 81.2%;
    height: 9.8%;
    display: flex;
    align-items: stretch;
    gap: .24%;
    padding: .14%;
    overflow: hidden;
    background: #080b09;
    border: 0;
    border-radius: 1px;
    box-shadow:
        inset 0 3px 6px rgba(0,0,0,.85),
        inset 0 -3px 5px rgba(0,0,0,.8);
}

/* LEVI PEAK */

#peak-left {
    left: 3.55%;
    width: 19.6%;
}

/* DESNI PEAK */

#peak-right {
    left: 76.49%;
    width: 20.06%;
}

/* LED SEGMENTI */

.peak-segment {
    flex: 1;
    min-width: 0;
    height: 100%;
    border-left: 1px solid #080a07;
    border-right: 1px solid #080a07;
    background: linear-gradient(
        to bottom,
        #070b08,
        #101711 30%,
        #101811 65%,
        #060906
    );
    box-shadow:
        inset 0 3px 4px rgba(0,0,0,.55),
        inset 0 -3px 4px rgba(0,0,0,.5);
}

.peak-segment.active.green {
    background: linear-gradient(
        to bottom,
        #21471f 0%,
        #397f30 22%,
        #49b03b 48%,
        #27852a 72%,
        #173c1b 100%
    );
}

.peak-segment.active.yellow {
    background: linear-gradient(
        to bottom,
        #54431d 0%,
        #a58a2d 22%,
        #d1b43b 48%,
        #a08128 72%,
        #483719 100%
    );
}

.peak-segment.active.red {
    background: linear-gradient(
        to bottom,
        #53241c 0%,
        #9d3928 22%,
        #c54b35 48%,
        #8c2c20 72%,
        #401b17 100%
    );
}

/* ZAMAZANO STAKLO */

.peak-meter::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse 20% 65% at 4% 8%,
            rgba(171,150,112,.32),
            transparent 90%
        ),
        radial-gradient(
            ellipse 15% 80% at 96% 90%,
            rgba(125,100,69,.28),
            transparent 90%
        ),
        radial-gradient(
            ellipse 27% 75% at 38% 50%,
            rgba(28,23,15,.22),
            transparent 100%
        ),
        radial-gradient(
            ellipse 20% 65% at 76% 28%,
            rgba(104,87,56,.16),
            transparent 100%
        ),
        repeating-linear-gradient(
            108deg,
            transparent 0 23px,
            rgba(160,145,112,.045) 24px,
            transparent 25px,
            transparent 41px
        ),
        linear-gradient(
            to bottom,
            rgba(0,0,0,.52),
            rgba(87,70,48,.12) 24%,
            transparent 47%,
            rgba(37,27,18,.15) 73%,
            rgba(0,0,0,.55)
        );
}

/* OSTECENE IVICE STAKLA */

.peak-meter::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(180,160,124,.40) 0,
            rgba(180,160,124,.13) 1.1%,
            transparent 2.5%
        ),
        radial-gradient(
            circle at 99% 100%,
            rgba(180,160,124,.36) 0,
            rgba(180,160,124,.10) 1.3%,
            transparent 3%
        ),
        radial-gradient(
            circle at 18% 0%,
            rgba(166,146,111,.20) 0,
            transparent 2.2%
        ),
        radial-gradient(
            circle at 83% 100%,
            rgba(166,146,111,.20) 0,
            transparent 2.6%
        );
    box-shadow:
        inset 0 0 3px rgba(176,148,109,.25),
        inset 0 0 9px rgba(0,0,0,.75);
}

/* SPECTRUM */

#spectrum {
    position: absolute;
    left: 28.5%;
    top: 67%;
    width: 43%;
    height: 27.5%;
    display: flex;
    align-items: flex-end;
    gap: .45%;
    overflow: hidden;
    background: #070908;
    padding: .2%;
}

.spectrum-bar {
    flex: 1;
    min-width: 0;
    height: 3%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0 5px,
            #080808 5px 8px
        ),
        linear-gradient(
            to top,
            #0ce238 0%,
            #28e91d 33%,
            #f4e11d 55%,
            #ff9916 75%,
            #f52416 100%
        );
    transition: height .14s linear;
}
</style>
</head>

<body>

<div id="display">

    <div id="air" class="off">OFF AIR</div>
    <div id="dj-name">DJ OFFLINE</div>

    <svg id="vu-overlay"
         viewBox="0 0 1000 333.333"
         preserveAspectRatio="none"
         aria-hidden="true">

        <g id="vu-left">
            <line class="needle"
                  x1="150" y1="174"
                  x2="150" y2="88"></line>
            <circle class="pivot"
                    cx="150" cy="174" r="5"></circle>
        </g>

        <g id="vu-right">
            <line class="needle"
                  x1="850" y1="174"
                  x2="850" y2="88"></line>
            <circle class="pivot"
                    cx="850" cy="174" r="5"></circle>
        </g>
    </svg>

    <div id="peak-left" class="peak-meter"></div>
    <div id="peak-right" class="peak-meter"></div>

    <div id="spectrum"></div>

</div>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(
        window.location.search
    );

    const djName = (
        params.get("dj") || ""
    ).trim().slice(0, 80);

    const isOnAir = djName.length > 0;

    const display = document.getElementById("display");
    const djElement = document.getElementById("dj-name");
    const airElement = document.getElementById("air");

    djElement.textContent = isOnAir
        ? djName
        : "DJ OFFLINE";

    airElement.textContent = isOnAir
        ? "ON AIR"
        : "OFF AIR";

    airElement.classList.toggle("off", !isOnAir);

    function fitText(element, ratio) {
        let size = display.clientWidth * ratio;

        element.style.fontSize = size + "px";

        while (
            element.scrollWidth > element.clientWidth &&
            size > 10
        ) {
            size -= 1;
            element.style.fontSize = size + "px";
        }
    }

    function resizeText() {
        fitText(airElement, .046);
        fitText(djElement, .051);
    }

    window.addEventListener("resize", resizeText);
    resizeText();

    function createPeakMeter(elementId) {
        const container = document.getElementById(elementId);
        const segments = [];

        for (let i = 0; i < 18; i++) {
            const segment = document.createElement("span");
            let color = "green";

            if (i >= 10 && i < 14) color = "yellow";
            if (i >= 14) color = "red";

            segment.className = "peak-segment " + color;
            container.appendChild(segment);
            segments.push(segment);
        }

        return segments;
    }

    const peakLeft = createPeakMeter("peak-left");
    const peakRight = createPeakMeter("peak-right");

    const spectrum = document.getElementById("spectrum");
    const spectrumBars = [];
    const spectrumCount = 36;

    for (let i = 0; i < spectrumCount; i++) {
        const bar = document.createElement("div");
        bar.className = "spectrum-bar";
        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }

    const vuLeft = document.getElementById("vu-left");
    const vuRight = document.getElementById("vu-right");

    let leftLevel = 0;
    let rightLevel = 0;
    let phase = 0;

    function updateLevel(current) {
        if (!isOnAir) return 0;

        const target = .25 + Math.random() * .70;
        return current * .35 + target * .65;
    }

    function updatePeak(segments, level) {
        const activeCount = Math.round(
            level * segments.length
        );

        segments.forEach(function (segment, index) {
            segment.classList.toggle(
                "active",
                index < activeCount
            );
        });
    }

    function animate() {
        phase += .20;

        leftLevel = updateLevel(leftLevel);
        rightLevel = updateLevel(rightLevel);

        const leftAngle = -45 + leftLevel * 90;
        const rightAngle = -45 + rightLevel * 90;

        vuLeft.setAttribute(
            "transform",
            "rotate(" + leftAngle + " 150 174)"
        );

        vuRight.setAttribute(
            "transform",
            "rotate(" + rightAngle + " 850 174)"
        );

        updatePeak(peakLeft, leftLevel);
        updatePeak(peakRight, rightLevel);

        spectrumBars.forEach(function (bar, index) {
            if (!isOnAir) {
                bar.style.height = "3%";
                return;
            }

            const middle = (spectrumCount - 1) / 2;
            const distance = Math.abs(index - middle) / middle;
            const centerShape = 1 - distance * .62;

            const wave =
                .56 +
                .22 * Math.sin(phase + index * .43) +
                .17 * Math.sin(phase * .71 - index * .35);

            const variation = Math.random() * 15;

            const height = Math.max(
                5,
                Math.min(
                    97,
                    centerShape * wave * 115 + variation
                )
            );

            bar.style.height = height + "%";
        });
    }

    animate();
    setInterval(animate, 170);
})();
</script>

</body>
</html>
