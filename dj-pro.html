<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#display {
  position: relative;
  width: min(100vw, 300vh);
  aspect-ratio: 3 / 1;
  flex: none;
  overflow: hidden;
  background: #080606 url("./display-bg.png") center / 100% 100% no-repeat;
  font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR / OFF AIR */

#air {
  position: absolute;
  left: 35%;
  top: 8%;
  width: 30%;
  height: 16%;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  font-weight: 900;
  letter-spacing: .03em;

  color: #c5b7a1;
  background-image:
    repeating-linear-gradient(
      105deg,
      transparent 0px,
      transparent 12px,
      rgba(63, 40, 27, .18) 13px,
      transparent 14px
    ),
    linear-gradient(
      180deg,
      #e5dfd2 0%,
      #a99f90 22%,
      #d1c7b6 43%,
      #817365 60%,
      #c5a88d 78%,
      #9e8b78 100%
    );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: .35px #594436;

  filter: drop-shadow(1px 2px 1px #160d09);
}

#air.off {
  opacity: .65;
}

/* DJ NAME */

#dj-name {
  position: absolute;
  left: 30%;
  top: 37%;
  width: 40%;
  height: 14%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  white-space: nowrap;
  font-weight: 900;
  font-style: italic;
  line-height: 1;
}

#dj-name-text {
  display: inline-block;

  color: #c6bcab;

  background-image:
    repeating-linear-gradient(
      108deg,
      transparent 0px,
      transparent 16px,
      rgba(91, 53, 32, .16) 17px,
      transparent 18px
    ),
    linear-gradient(
      180deg,
      #eee7d9 0%,
      #a8a092 16%,
      #d9d0c0 32%,
      #8f8477 48%,
      #c8b8a3 65%,
      #9b7960 82%,
      #c9bca8 100%
    );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: .4px #624a3a;

  filter: drop-shadow(2px 3px 1px #120b08);
}

/* VU NEEDLES — NEPROMENJENO */

#vu-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.vu-needle-shadow {
  stroke: rgba(0, 0, 0, .65);
  stroke-width: 3.4;
  stroke-linecap: round;
}

.vu-needle-metal {
  stroke: #69261e;
  stroke-width: 2.2;
  stroke-linecap: round;
}

.vu-needle-highlight {
  stroke: #c16b54;
  stroke-width: .65;
  stroke-linecap: round;
}

.vu-pivot-outer {
  fill: #201a18;
  stroke: #9b8271;
  stroke-width: 1.5;
}

.vu-pivot-inner {
  fill: #77665a;
  stroke: #302722;
  stroke-width: .7;
}

/* PEAK — SAMO VISINA SMANJENA */

.peak-meter {
  position: absolute;
  top: 82.2%;
  height: 8.7%;
  display: flex;
  align-items: stretch;
  gap: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

#peak-left {
  left: 3.55%;
  width: 19.55%;
}

#peak-right {
  left: 76.5%;
  width: 20.05%;
}

.peak-segment {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  margin-right: 2px;
  border-left: 1px solid rgba(0, 0, 0, .85);
  border-right: 1px solid rgba(0, 0, 0, .85);
  background: linear-gradient(
    to bottom,
    #080d09 0%,
    #111913 25%,
    #111913 70%,
    #060906 100%
  );
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, .6),
    inset 0 -2px 4px rgba(0, 0, 0, .6);
}

.peak-segment:last-child {
  margin-right: 0;
}

.peak-segment.active.green {
  background: linear-gradient(
    to bottom,
    #18361a 0%,
    #2b632b 20%,
    #438c39 48%,
    #28672a 75%,
    #112b15 100%
  );
}

.peak-segment.active.yellow {
  background: linear-gradient(
    to bottom,
    #46371b 0%,
    #8d7428 20%,
    #c0a337 48%,
    #8b7127 75%,
    #362b17 100%
  );
}

.peak-segment.active.red {
  background: linear-gradient(
    to bottom,
    #431c17 0%,
    #8d3024 20%,
    #b94330 48%,
    #842a20 75%,
    #351612 100%
  );
}

.peak-meter::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 22% 75% at 6% 15%,
      rgba(161, 142, 107, .23),
      transparent 90%
    ),
    radial-gradient(
      ellipse 18% 80% at 95% 85%,
      rgba(119, 100, 72, .22),
      transparent 90%
    ),
    radial-gradient(
      ellipse 28% 85% at 40% 50%,
      rgba(30, 24, 17, .18),
      transparent 100%
    ),
    repeating-linear-gradient(
      108deg,
      transparent 0 23px,
      rgba(160, 145, 112, .035) 24px,
      transparent 25px,
      transparent 41px
    ),
    linear-gradient(
      to bottom,
      rgba(0, 0, 0, .36),
      rgba(80, 65, 45, .09) 25%,
      transparent 50%,
      rgba(30, 23, 17, .12) 75%,
      rgba(0, 0, 0, .38)
    );
}

.peak-meter::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 18% 50% at 0% 0%,
      rgba(166, 143, 106, .15),
      transparent
    ),
    radial-gradient(
      ellipse 18% 50% at 100% 100%,
      rgba(166, 143, 106, .15),
      transparent
    );
  box-shadow:
    inset 0 0 3px rgba(166, 143, 106, .2),
    inset 0 0 6px rgba(0, 0, 0, .45);
}

/* SPECTRUM — NEPROMENJENO */

#spectrum {
  position: absolute;
  left: 28.5%;
  top: 67%;
  width: 43%;
  height: 27.5%;

  display: flex;
  align-items: stretch;
  gap: 2px;

  padding: 2px;
  overflow: hidden;

  background: #050705;
}

.spectrum-column {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;

  display: flex;
  flex-direction: column-reverse;
  gap: 2px;
}

.spectrum-led {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;

  background: #0c100c;
  opacity: .55;
}

.spectrum-led.off {
  background: #0d120e;
  opacity: .48;
}

.spectrum-led.on.green {
  background: #19e51d;
  opacity: 1;
}

.spectrum-led.on.lime {
  background: #9eea12;
  opacity: 1;
}

.spectrum-led.on.yellow {
  background: #f1e316;
  opacity: 1;
}

.spectrum-led.on.orange {
  background: #ff9810;
  opacity: 1;
}

.spectrum-led.on.red {
  background: #ed2916;
  opacity: 1;
}

</style>
</head>

<body>

<div id="display">

  <div id="air" class="off">OFF AIR</div>

  <div id="dj-name">
    <span id="dj-name-text">DJ OFFLINE</span>
  </div>

  <svg
    id="vu-overlay"
    viewBox="0 0 1000 333.333"
    preserveAspectRatio="none"
    aria-hidden="true"
  >

    <g id="vu-left">
      <line class="vu-needle-shadow"
            x1="151.2" y1="174"
            x2="151.2" y2="90"/>

      <line class="vu-needle-metal"
            x1="150" y1="174"
            x2="150" y2="90"/>

      <line class="vu-needle-highlight"
            x1="149.4" y1="171"
            x2="149.4" y2="94"/>

      <circle class="vu-pivot-outer"
              cx="150" cy="174" r="5"/>

      <circle class="vu-pivot-inner"
              cx="150" cy="174" r="2.4"/>
    </g>

    <g id="vu-right">
      <line class="vu-needle-shadow"
            x1="851.2" y1="174"
            x2="851.2" y2="90"/>

      <line class="vu-needle-metal"
            x1="850" y1="174"
            x2="850" y2="90"/>

      <line class="vu-needle-highlight"
            x1="849.4" y1="171"
            x2="849.4" y2="94"/>

      <circle class="vu-pivot-outer"
              cx="850" cy="174" r="5"/>

      <circle class="vu-pivot-inner"
              cx="850" cy="174" r="2.4"/>
    </g>

  </svg>

  <div id="peak-left" class="peak-meter"></div>
  <div id="peak-right" class="peak-meter"></div>

  <div id="spectrum"></div>

</div>

<script>
(function () {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const djName = (params.get("dj") || "").trim().slice(0, 80);
  const isOnAir = djName.length > 0;

  const display = document.getElementById("display");
  const djContainer = document.getElementById("dj-name");
  const djElement = document.getElementById("dj-name-text");
  const airElement = document.getElementById("air");

  djElement.textContent = isOnAir ? djName : "DJ OFFLINE";
  airElement.textContent = isOnAir ? "ON AIR" : "OFF AIR";
  airElement.classList.toggle("off", !isOnAir);

  function fitText(element, container, ratio) {
    let size = display.clientWidth * ratio;

    element.style.fontSize = size + "px";

    while (
      element.scrollWidth > container.clientWidth &&
      size > 10
    ) {
      size -= 1;
      element.style.fontSize = size + "px";
    }
  }

  function resizeText() {
    fitText(airElement, airElement, .046);
    fitText(djElement, djContainer, .051);
  }

  window.addEventListener("resize", resizeText);
  resizeText();

  /* PEAK */

  function createPeakMeter(elementId) {
    const container = document.getElementById(elementId);
    const segments = [];

    for (let i = 0; i < 17; i++) {
      const segment = document.createElement("span");

      let color = "green";

      if (i >= 10 && i < 14) {
        color = "yellow";
      }

      if (i >= 14) {
        color = "red";
      }

      segment.className = "peak-segment " + color;
      container.appendChild(segment);
      segments.push(segment);
    }

    return segments;
  }

  const peakLeft = createPeakMeter("peak-left");
  const peakRight = createPeakMeter("peak-right");

  /* SPECTRUM */

  const spectrum = document.getElementById("spectrum");

  const spectrumColumns = [];
  const spectrumCount = 36;
  const ledRows = 22;

  for (let i = 0; i < spectrumCount; i++) {
    const column = document.createElement("div");
    column.className = "spectrum-column";

    const leds = [];

    for (let j = 0; j < ledRows; j++) {
      const led = document.createElement("div");

      let color = "green";

      if (j >= 9 && j < 12) {
        color = "lime";
      } else if (j >= 12 && j < 16) {
        color = "yellow";
      } else if (j >= 16 && j < 19) {
        color = "orange";
      } else if (j >= 19) {
        color = "red";
      }

      led.className = "spectrum-led off";
      led.dataset.color = color;

      column.appendChild(led);
      leds.push(led);
    }

    spectrum.appendChild(column);
    spectrumColumns.push(leds);
  }

  /* VU */

  const vuLeft = document.getElementById("vu-left");
  const vuRight = document.getElementById("vu-right");

  let leftLevel = 0;
  let rightLevel = 0;
  let phase = 0;

  function updateLevel(current) {
    if (!isOnAir) {
      return 0;
    }

    const target = .25 + Math.random() * .70;

    return current * .35 + target * .65;
  }

  function updatePeak(segments, level) {
    const activeCount = Math.round(level * segments.length);

    segments.forEach(function (segment, index) {
      segment.classList.toggle(
        "active",
        index < activeCount
      );
    });
  }

  /* ANIMACIJA */

  function animate() {
    phase += .20;

    leftLevel = updateLevel(leftLevel);
    rightLevel = updateLevel(rightLevel);

    const leftAngle = -45 + leftLevel * 90;
    const rightAngle = -45 + rightLevel * 90;

    vuLeft.setAttribute(
      "transform",
      "rotate(" + leftAngle + " 150 174)"
    );

    vuRight.setAttribute(
      "transform",
      "rotate(" + rightAngle + " 850 174)"
    );

    updatePeak(peakLeft, leftLevel);
    updatePeak(peakRight, rightLevel);

    spectrumColumns.forEach(function (leds, index) {
      let activeRows = 0;

      if (isOnAir) {
        const middle = (spectrumCount - 1) / 2;
        const distance = Math.abs(index - middle) / middle;
        const centerShape = 1 - distance * .62;

        const wave =
          .56 +
          .22 * Math.sin(phase + index * .43) +
          .17 * Math.sin(phase * .71 - index * .35);

        const variation = Math.random() * 15;

        const height = Math.max(
          5,
          Math.min(
            97,
            centerShape * wave * 115 + variation
          )
        );

        activeRows = Math.round(height / 100 * ledRows);
      }

      leds.forEach(function (led, row) {
        if (row < activeRows) {
          led.className =
            "spectrum-led on " + led.dataset.color;
        } else {
          led.className = "spectrum-led off";
        }
      });
    });
  }

  animate();
  setInterval(animate, 170);

})();
</script>

</body>
</html>
