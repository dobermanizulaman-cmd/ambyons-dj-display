
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#display {
    position: relative;
    width: min(100vw, 300vh);
    aspect-ratio: 3 / 1;
    flex: none;
    overflow: hidden;
    background: #080606 url("./display-bg.png")
        center / 100% 100% no-repeat;
    font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR / OFF AIR */

#air {
    position: absolute;
    left: 35%;
    top: 8%;
    width: 30%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    color: #fff1e8;
    font-weight: 900;
    letter-spacing: 0.03em;
    text-shadow:
        0 0 8px #ff2515,
        0 0 18px #b90000,
        2px 3px 2px #290000;
}

#air.off {
    color: #9b8c86;
    text-shadow: 2px 3px 3px #100808;
}

/* DJ IME */

#dj-name {
    position: absolute;
    left: 30%;
    top: 37%;
    width: 40%;
    height: 14%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    color: #eee7df;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    text-shadow:
        2px 2px 0 #503028,
        4px 4px 0 #100b09;
}

/* VU KAZALJKE - NE MENJAMO */

#vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.needle {
    stroke: #ff3020;
    stroke-width: 4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #ff2515);
}

.pivot {
    fill: #34231c;
    stroke: #a58a75;
    stroke-width: 2;
}

/*
   PEAK L / PEAK R

   Položaj prema poslednjoj celoj slici.
   Staklo i LED su u ISTOM okviru.
   Nema zasebnih nacrtanih cik-cak linija.
*/

.peak-meter {
    position: absolute;
    top: 83.1%;
    height: 10.7%;
    display: flex;
    align-items: stretch;
    gap: 0.28%;
    padding: 0.16%;
    overflow: hidden;

    background: #070907;
    border: 0;
    border-radius: 2px;

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,0.9),
        inset 0 -2px 4px rgba(0,0,0,0.85);
}

#peak-left {
    left: 2.85%;
    width: 19.35%;
}

#peak-right {
    left: 77.55%;
    width: 19.25%;
}

/* LED SEGMENTI */

.peak-segment {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;

    border-left: 1px solid #080b08;
    border-right: 1px solid #080b08;

    background: #111812;

    box-shadow:
        inset 0 3px 5px rgba(0,0,0,0.65),
        inset 0 -3px 5px rgba(0,0,0,0.55);
}

.peak-segment.active.green {
    background: linear-gradient(
        to bottom,
        #244d23 0%,
        #368f31 20%,
        #44b63c 48%,
        #237b27 78%,
        #153c1a 100%
    );
}

.peak-segment.active.yellow {
    background: linear-gradient(
        to bottom,
        #59461c 0%,
        #a8892a 20%,
        #d0b33e 48%,
        #947224 78%,
        #483719 100%
    );
}

.peak-segment.active.red {
    background: linear-gradient(
        to bottom,
        #54231c 0%,
        #9c3326 20%,
        #c74732 48%,
        #87291f 78%,
        #3d1a17 100%
    );
}

/*
   ZAPRLJANO STAKLO

   Slojevi prašine, masnih tragova,
   nejednakog zatamnjenja i odsjaja.
*/

.peak-meter::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse 24% 85% at 17% 22%,
            rgba(139,112,75,0.26),
            transparent 100%
        ),
        radial-gradient(
            ellipse 18% 110% at 73% 85%,
            rgba(86,61,35,0.30),
            transparent 100%
        ),
        radial-gradient(
            ellipse 30% 65% at 45% 40%,
            rgba(13,10,8,0.24),
            transparent 100%
        ),
        repeating-linear-gradient(
            117deg,
            transparent 0 21px,
            rgba(125,112,87,0.055) 22px,
            transparent 24px,
            transparent 43px
        ),
        linear-gradient(
            to bottom,
            rgba(20,14,10,0.50),
            rgba(70,55,38,0.12) 27%,
            rgba(0,0,0,0.02) 48%,
            rgba(21,17,13,0.20) 70%,
            rgba(0,0,0,0.62)
        );
}

/*
   STAKLENA OSTECENJA

   Nepravilne tanke grane i sitne
   naprsline. Bez velikih cik-cak linija.
*/

.glass-damage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    opacity: 0.52;
}

.glass-damage .hairline {
    fill: none;
    stroke: rgba(209,192,160,0.58);
    stroke-width: 0.48;
    stroke-linejoin: round;
    stroke-linecap: round;
}

.glass-damage .shadowline {
    fill: none;
    stroke: rgba(5,5,4,0.80);
    stroke-width: 0.8;
    stroke-linejoin: round;
}

.glass-damage .chip {
    fill: rgba(160,143,112,0.16);
    stroke: rgba(201,185,156,0.38);
    stroke-width: 0.5;
}

/* SPECTRUM - ISTI POLOŽAJ */

#spectrum {
    position: absolute;
    left: 28.5%;
    top: 67%;
    width: 43%;
    height: 27.5%;
    display: flex;
    align-items: flex-end;
    gap: 0.45%;
    overflow: hidden;
    background: #070908;
    padding: 0.2%;
}

.spectrum-bar {
    flex: 1;
    min-width: 0;
    height: 3%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0 5px,
            #080808 5px 8px
        ),
        linear-gradient(
            to top,
            #0ce238 0%,
            #28e91d 33%,
            #f4e11d 55%,
            #ff9916 75%,
            #f52416 100%
        );
    transition: height 0.14s linear;
}
</style>
</head>

<body>

<div id="display">

    <div id="air" class="off">OFF AIR</div>

    <div id="dj-name">DJ OFFLINE</div>

    <!-- VU -->

    <svg
        id="vu-overlay"
        viewBox="0 0 1000 333.333"
        preserveAspectRatio="none"
        aria-hidden="true">

        <g id="vu-left">
            <line
                class="needle"
                x1="150"
                y1="174"
                x2="150"
                y2="88">
            </line>
            <circle
                class="pivot"
                cx="150"
                cy="174"
                r="5">
            </circle>
        </g>

        <g id="vu-right">
            <line
                class="needle"
                x1="850"
                y1="174"
                x2="850"
                y2="88">
            </line>
            <circle
                class="pivot"
                cx="850"
                cy="174"
                r="5">
            </circle>
        </g>
    </svg>

    <!-- PEAK LEFT -->

    <div id="peak-left" class="peak-meter">

        <svg
            class="glass-damage"
            viewBox="0 0 400 70"
            preserveAspectRatio="none"
            aria-hidden="true">

            <path class="chip"
                d="M0 0 L19 0 L13 9 L24 17 L8 14 L0 24 Z"/>

            <path class="hairline"
                d="M9 0 L19 14 L32 21 L41 33
                   L59 38 L71 51 L86 55"/>

            <path class="hairline"
                d="M32 21 L35 10 L49 3"/>

            <path class="hairline"
                d="M41 33 L34 46 L38 63"/>

            <path class="hairline"
                d="M59 38 L70 29 L89 27"/>

            <path class="shadowline"
                d="M10 1 L20 15 L33 22 L42 34"/>

            <path class="hairline"
                d="M400 0 L385 11 L376 18
                   L365 34 L348 41"/>

            <path class="hairline"
                d="M376 18 L365 10 L353 7"/>

            <path class="hairline"
                d="M365 34 L379 43 L386 58"/>

            <path class="hairline"
                d="M348 41 L337 54 L319 61"/>

            <path class="chip"
                d="M400 58 L389 64 L380 70 L400 70 Z"/>

        </svg>

    </div>

    <!-- PEAK RIGHT -->

    <div id="peak-right" class="peak-meter">

        <svg
            class="glass-damage"
            viewBox="0 0 400 70"
            preserveAspectRatio="none"
            aria-hidden="true">

            <path class="chip"
                d="M400 0 L381 0 L388 12
                   L375 18 L393 25 L400 30 Z"/>

            <path class="hairline"
                d="M390 0 L379 15 L365 23
                   L355 38 L337 44 L326 57"/>

            <path class="hairline"
                d="M365 23 L362 8 L349 2"/>

            <path class="hairline"
                d="M355 38 L367 51 L363 68"/>

            <path class="hairline"
                d="M337 44 L322 34 L305 31"/>

            <path class="shadowline"
                d="M391 1 L380 16 L366 24 L356 39"/>

            <path class="hairline"
                d="M0 0 L16 10 L25 20
                   L39 34 L55 40"/>

            <path class="hairline"
                d="M25 20 L35 10 L47 6"/>

            <path class="hairline"
                d="M39 34 L25 47 L18 62"/>

            <path class="hairline"
                d="M55 40 L69 53 L82 60"/>

            <path class="chip"
                d="M0 60 L11 64 L19 70 L0 70 Z"/>

        </svg>

    </div>

    <!-- SPECTRUM -->

    <div id="spectrum"></div>

</div>

<script>
(function () {
    "use strict";

    /* DJ STATUS */

    const params = new URLSearchParams(
        window.location.search
    );

    const djName = (
        params.get("dj") || ""
    ).trim().slice(0, 80);

    const isOnAir = djName.length > 0;

    const display = document.getElementById(
        "display"
    );

    const djElement = document.getElementById(
        "dj-name"
    );

    const airElement = document.getElementById(
        "air"
    );

    djElement.textContent = isOnAir
        ? djName
        : "DJ OFFLINE";

    airElement.textContent = isOnAir
        ? "ON AIR"
        : "OFF AIR";

    airElement.classList.toggle(
        "off",
        !isOnAir
    );

    /* VELICINA TEKSTA */

    function fitText(element, ratio) {
        let size = display.clientWidth * ratio;

        element.style.fontSize = size + "px";

        while (
            element.scrollWidth >
            element.clientWidth &&
            size > 10
        ) {
            size -= 1;
            element.style.fontSize =
                size + "px";
        }
    }

    function resizeText() {
        fitText(airElement, 0.046);
        fitText(djElement, 0.051);
    }

    window.addEventListener(
        "resize",
        resizeText
    );

    resizeText();

    /* PEAK LED */

    function createPeakMeter(elementId) {
        const container = document.getElementById(
            elementId
        );

        const segments = [];

        for (let i = 0; i < 18; i++) {
            const segment = document.createElement(
                "span"
            );

            let color = "green";

            if (i >= 10 && i < 14) {
                color = "yellow";
            }

            if (i >= 14) {
                color = "red";
            }

            segment.className =
                "peak-segment " + color;

            container.appendChild(segment);
            segments.push(segment);
        }

        return segments;
    }

    const peakLeft = createPeakMeter(
        "peak-left"
    );

    const peakRight = createPeakMeter(
        "peak-right"
    );

    /* SPECTRUM */

    const spectrum = document.getElementById(
        "spectrum"
    );

    const spectrumBars = [];
    const spectrumCount = 36;

    for (let i = 0; i < spectrumCount; i++) {
        const bar = document.createElement(
            "div"
        );

        bar.className = "spectrum-bar";

        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }

    /* VU */

    const vuLeft = document.getElementById(
        "vu-left"
    );

    const vuRight = document.getElementById(
        "vu-right"
    );

    let leftLevel = 0;
    let rightLevel = 0;
    let phase = 0;

    /* DEKORATIVNA ANIMACIJA */

    function updateLevel(current) {
        if (!isOnAir) {
            return 0;
        }

        const target =
            0.25 + Math.random() * 0.70;

        return current * 0.35 +
               target * 0.65;
    }

    function updatePeak(segments, level) {
        const activeCount = Math.round(
            level * segments.length
        );

        segments.forEach(function (
            segment,
            index
        ) {
            segment.classList.toggle(
                "active",
                index < activeCount
            );
        });
    }

    function animate() {
        phase += 0.20;

        leftLevel = updateLevel(leftLevel);
        rightLevel = updateLevel(rightLevel);

        /* VU KAZALJKE */

        const leftAngle =
            -45 + leftLevel * 90;

        const rightAngle =
            -45 + rightLevel * 90;

        vuLeft.setAttribute(
            "transform",
            "rotate(" +
                leftAngle +
                " 150 174)"
        );

        vuRight.setAttribute(
            "transform",
            "rotate(" +
                rightAngle +
                " 850 174)"
        );

        /* PEAK */

        updatePeak(
            peakLeft,
            leftLevel
        );

        updatePeak(
            peakRight,
            rightLevel
        );

        /* SPECTRUM */

        spectrumBars.forEach(function (
            bar,
            index
        ) {
            if (!isOnAir) {
                bar.style.height = "3%";
                return;
            }

            const middle =
                (spectrumCount - 1) / 2;

            const distance =
                Math.abs(index - middle) /
                middle;

            const centerShape =
                1 - distance * 0.62;

            const wave =
                0.56 +
                0.22 * Math.sin(
                    phase + index * 0.43
                ) +
                0.17 * Math.sin(
                    phase * 0.71 -
                    index * 0.35
                );

            const variation =
                Math.random() * 15;

            const height = Math.max(
                5,
                Math.min(
                    97,
                    centerShape * wave * 115 +
                    variation
                )
            );

            bar.style.height =
                height + "%";
        });
    }

    animate();
    setInterval(animate, 170);

})();
</script>

</body>
</html>
