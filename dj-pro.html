
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmbYonS DJ DISPLAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#display {
    position: relative;
    width: min(100vw, 300vh);
    aspect-ratio: 3 / 1;
    flex: none;
    overflow: hidden;
    background: #080606 url("./display-bg.png")
        center / 100% 100% no-repeat;
    font-family: Impact, "Arial Black", Arial, sans-serif;
}

/* ON AIR - BEZ IZMENA */
#air {
    position: absolute;
    left: 35%;
    top: 8%;
    width: 30%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    font-weight: 900;
    letter-spacing: .03em;
    color: #c7c2b7;
    background-image:
        repeating-linear-gradient(
            107deg,
            transparent 0 17px,
            rgba(43,29,22,.28) 17.5px,
            transparent 18.5px
        ),
        linear-gradient(
            180deg,
            #eee9df 0%,
            #a7a49e 18%,
            #d4d0c6 34%,
            #777570 49%,
            #c5bfb3 63%,
            #8b7664 82%,
            #d0c5b4 100%
        );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: .35px #6b5545;
    filter:
        drop-shadow(0 0 5px #a51d13)
        drop-shadow(0 0 10px #7a160f);
}

#air.off {
    filter: drop-shadow(1px 2px 2px #100808);
}

/* DJ IME - BEZ IZMENA */
#dj-name {
    position: absolute;
    left: 30%;
    top: 37%;
    width: 40%;
    height: 14%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    color: #c4bdb1;
    background-image:
        repeating-linear-gradient(
            113deg,
            transparent 0 13px,
            rgba(37,28,23,.36) 13.5px,
            transparent 14.5px,
            transparent 31px
        ),
        repeating-linear-gradient(
            173deg,
            transparent 0 23px,
            rgba(94,53,32,.22) 23.5px,
            transparent 25px
        ),
        linear-gradient(
            180deg,
            #eee9df 0%,
            #b9b5ad 13%,
            #e0dacf 26%,
            #8c8982 39%,
            #d1cbc0 52%,
            #aaa093 65%,
            #8b6047 78%,
            #c6bbae 90%,
            #77716b 100%
        );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: .45px #57483c;
    filter: drop-shadow(2px 3px 1px #120c09);
}

/* VU - BEZ IZMENA */
#vu-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.vu-needle-shadow {
    stroke: rgba(0,0,0,.65);
    stroke-width: 3.4;
    stroke-linecap: round;
}

.vu-needle-metal {
    stroke: #69261e;
    stroke-width: 2.2;
    stroke-linecap: round;
}

.vu-needle-highlight {
    stroke: #c16b54;
    stroke-width: .65;
    stroke-linecap: round;
}

.vu-pivot-outer {
    fill: #201a18;
    stroke: #9b8271;
    stroke-width: 1.5;
}

.vu-pivot-inner {
    fill: #77665a;
    stroke: #302722;
    stroke-width: .7;
}

/* PEAK - BEZ IZMENA */
.peak-meter {
    position: absolute;
    top: 81.2%;
    height: 9.2%;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

#peak-left {
    left: 3.55%;
    width: 19.55%;
}

#peak-right {
    left: 76.5%;
    width: 20.05%;
}

.peak-segment {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    margin-right: 2px;
    border-left: 1px solid rgba(0,0,0,.85);
    border-right: 1px solid rgba(0,0,0,.85);
    background: linear-gradient(
        to bottom,
        #080d09 0%,
        #111913 25%,
        #111913 70%,
        #060906 100%
    );
    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.6),
        inset 0 -2px 4px rgba(0,0,0,.6);
}

.peak-segment:last-child {
    margin-right: 0;
}

.peak-segment.active.green {
    background: linear-gradient(
        to bottom,
        #18361a 0%,
        #2b632b 20%,
        #438c39 48%,
        #28672a 75%,
        #112b15 100%
    );
}

.peak-segment.active.yellow {
    background: linear-gradient(
        to bottom,
        #46371b 0%,
        #8d7428 20%,
        #c0a337 48%,
        #8b7127 75%,
        #362b17 100%
    );
}

.peak-segment.active.red {
    background: linear-gradient(
        to bottom,
        #431c17 0%,
        #8d3024 20%,
        #b94330 48%,
        #842a20 75%,
        #351612 100%
    );
}

.peak-meter::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse 22% 75% at 6% 15%,
            rgba(161,142,107,.23),
            transparent 90%
        ),
        radial-gradient(
            ellipse 18% 80% at 95% 85%,
            rgba(119,100,72,.22),
            transparent 90%
        ),
        radial-gradient(
            ellipse 28% 85% at 40% 50%,
            rgba(30,24,17,.18),
            transparent 100%
        ),
        repeating-linear-gradient(
            108deg,
            transparent 0 23px,
            rgba(160,145,112,.035) 24px,
            transparent 25px,
            transparent 41px
        ),
        linear-gradient(
            to bottom,
            rgba(0,0,0,.36),
            rgba(80,65,45,.09) 25%,
            transparent 50%,
            rgba(30,23,17,.12) 75%,
            rgba(0,0,0,.38)
        );
}

.peak-meter::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse 18% 50% at 0% 0%,
            rgba(166,143,106,.15),
            transparent
        ),
        radial-gradient(
            ellipse 18% 50% at 100% 100%,
            rgba(166,143,106,.15),
            transparent
        );
    box-shadow:
        inset 0 0 3px rgba(166,143,106,.2),
        inset 0 0 6px rgba(0,0,0,.45);
}

/* SPECTRUM - POZICIJA I STUBICI BEZ IZMENA */
#spectrum {
    position: absolute;
    left: 28.5%;
    top: 67%;
    width: 43%;
    height: 27.5%;
    display: flex;
    align-items: flex-end;
    gap: .45%;
    overflow: hidden;
    background: #070908;
    padding: .2%;
}

.spectrum-bar {
    flex: 1;
    min-width: 0;
    height: 3%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0 5px,
            #080808 5px 8px
        ),
        linear-gradient(
            to top,
            #0ce238 0%,
            #28e91d 33%,
            #f4e11d 55%,
            #ff9916 75%,
            #f52416 100%
        );
    transition: height .14s linear;
}

/* SAMO STAKLO PREKO SPECTRUM-A:
   PRLJAVSTINA I ZAMAZANI TRAGOVI */
#spectrum::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse 25% 48% at 12% 22%,
            rgba(148,130,100,.25),
            transparent 100%
        ),
        radial-gradient(
            ellipse 19% 61% at 39% 78%,
            rgba(114,98,76,.17),
            transparent 100%
        ),
        radial-gradient(
            ellipse 32% 38% at 70% 15%,
            rgba(159,141,109,.20),
            transparent 100%
        ),
        radial-gradient(
            ellipse 23% 57% at 91% 83%,
            rgba(131,110,81,.25),
            transparent 100%
        ),
        radial-gradient(
            ellipse 15% 28% at 53% 52%,
            rgba(101,86,67,.13),
            transparent 100%
        ),
        linear-gradient(
            to bottom,
            rgba(92,75,51,.28) 0%,
            rgba(60,49,36,.10) 19%,
            transparent 44%,
            transparent 69%,
            rgba(69,54,39,.12) 85%,
            rgba(83,63,43,.30) 100%
        );
    box-shadow:
        inset 0 0 12px rgba(129,103,68,.27),
        inset 0 0 4px rgba(0,0,0,.4);
}

/* IZLOMLJENO STAKLO - SAMO PREKO SPEKTRA */
#spectrum-glass {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
}
</style>
</head>

<body>
<div id="display">
    <div id="air" class="off">OFF AIR</div>
    <div id="dj-name">DJ OFFLINE</div>

    <svg id="vu-overlay"
         viewBox="0 0 1000 333.333"
         preserveAspectRatio="none"
         aria-hidden="true">
        <g id="vu-left">
            <line class="vu-needle-shadow"
                  x1="151.2" y1="174"
                  x2="151.2" y2="90"/>
            <line class="vu-needle-metal"
                  x1="150" y1="174"
                  x2="150" y2="90"/>
            <line class="vu-needle-highlight"
                  x1="149.4" y1="171"
                  x2="149.4" y2="94"/>
            <circle class="vu-pivot-outer"
                    cx="150" cy="174" r="5"/>
            <circle class="vu-pivot-inner"
                    cx="150" cy="174" r="2.4"/>
        </g>

        <g id="vu-right">
            <line class="vu-needle-shadow"
                  x1="851.2" y1="174"
                  x2="851.2" y2="90"/>
            <line class="vu-needle-metal"
                  x1="850" y1="174"
                  x2="850" y2="90"/>
            <line class="vu-needle-highlight"
                  x1="849.4" y1="171"
                  x2="849.4" y2="94"/>
            <circle class="vu-pivot-outer"
                    cx="850" cy="174" r="5"/>
            <circle class="vu-pivot-inner"
                    cx="850" cy="174" r="2.4"/>
        </g>
    </svg>

    <div id="peak-left" class="peak-meter"></div>
    <div id="peak-right" class="peak-meter"></div>

    <div id="spectrum">
        <svg id="spectrum-glass"
             viewBox="0 0 430 92"
             preserveAspectRatio="none"
             aria-hidden="true">

            <!-- RAZGRANATE PUKOTINE -->
            <g fill="none"
               stroke="#b8b0a0"
               stroke-linecap="round"
               stroke-linejoin="round">

                <path d="M0 17 L25 23 L47 20 L69 35 L91 32 L111 44 L138 40 L158 52"
                      stroke-width=".55"
                      opacity=".45"/>
                <path d="M69 35 L75 18 L91 7"
                      stroke-width=".38"
                      opacity=".36"/>
                <path d="M111 44 L105 63 L118 77"
                      stroke-width=".35"
                      opacity=".33"/>
                <path d="M47 20 L54 8 L63 0"
                      stroke-width=".32"
                      opacity=".30"/>

                <path d="M430 13 L405 20 L382 17 L362 31 L337 29 L315 43 L291 40 L270 54"
                      stroke-width=".55"
                      opacity=".45"/>
                <path d="M362 31 L355 13 L343 3"
                      stroke-width=".38"
                      opacity=".36"/>
                <path d="M315 43 L322 61 L308 79"
                      stroke-width=".35"
                      opacity=".33"/>
                <path d="M382 17 L376 6 L367 0"
                      stroke-width=".32"
                      opacity=".30"/>

                <path d="M175 0 L185 17 L180 30 L197 43 L191 57 L207 72 L202 92"
                      stroke-width=".45"
                      opacity=".35"/>
                <path d="M197 43 L214 37 L227 24"
                      stroke-width=".3"
                      opacity=".29"/>
                <path d="M191 57 L176 68 L169 85"
                      stroke-width=".3"
                      opacity=".27"/>
            </g>

            <!-- PRLJAVI RUBOVI PUKOTINA -->
            <g fill="none"
               stroke="#4b4031"
               stroke-linecap="round"
               opacity=".25">
                <path d="M1 18 L25 24 L47 21 L69 36 L91 33 L111 45 L138 41"
                      stroke-width="1.2"/>
                <path d="M429 14 L405 21 L382 18 L362 32 L337 30 L315 44 L291 41"
                      stroke-width="1.2"/>
                <path d="M176 0 L186 17 L181 30 L198 43 L192 57 L208 72 L203 92"
                      stroke-width="1"/>
            </g>
        </svg>
    </div>
</div>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(
        window.location.search
    );
    const djName = (
        params.get("dj") || ""
    ).trim().slice(0, 80);
    const isOnAir = djName.length > 0;

    const display =
        document.getElementById("display");
    const djElement =
        document.getElementById("dj-name");
    const airElement =
        document.getElementById("air");

    djElement.textContent = isOnAir
        ? djName
        : "DJ OFFLINE";
    airElement.textContent = isOnAir
        ? "ON AIR"
        : "OFF AIR";
    airElement.classList.toggle("off", !isOnAir);

    function fitText(element, ratio) {
        let size = display.clientWidth * ratio;
        element.style.fontSize = size + "px";
        while (
            element.scrollWidth > element.clientWidth &&
            size > 10
        ) {
            size -= 1;
            element.style.fontSize = size + "px";
        }
    }

    function resizeText() {
        fitText(airElement, .046);
        fitText(djElement, .051);
    }

    window.addEventListener("resize", resizeText);
    resizeText();

    function createPeakMeter(elementId) {
        const container =
            document.getElementById(elementId);
        const segments = [];

        for (let i = 0; i < 17; i++) {
            const segment = document.createElement("span");
            let color = "green";
            if (i >= 10 && i < 14) color = "yellow";
            if (i >= 14) color = "red";
            segment.className = "peak-segment " + color;
            container.appendChild(segment);
            segments.push(segment);
        }
        return segments;
    }

    const peakLeft = createPeakMeter("peak-left");
    const peakRight = createPeakMeter("peak-right");

    const spectrum = document.getElementById("spectrum");
    const spectrumBars = [];
    const spectrumCount = 36;

    for (let i = 0; i < spectrumCount; i++) {
        const bar = document.createElement("div");
        bar.className = "spectrum-bar";
        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }

    const vuLeft = document.getElementById("vu-left");
    const vuRight = document.getElementById("vu-right");

    let leftLevel = 0;
    let rightLevel = 0;
    let phase = 0;

    function updateLevel(current) {
        if (!isOnAir) return 0;
        const target = .25 + Math.random() * .70;
        return current * .35 + target * .65;
    }

    function updatePeak(segments, level) {
        const activeCount = Math.round(
            level * segments.length
        );
        segments.forEach(function (segment, index) {
            segment.classList.toggle(
                "active",
                index < activeCount
            );
        });
    }

    function animate() {
        phase += .20;
        leftLevel = updateLevel(leftLevel);
        rightLevel = updateLevel(rightLevel);

        const leftAngle = -45 + leftLevel * 90;
        const rightAngle = -45 + rightLevel * 90;

        vuLeft.setAttribute(
            "transform",
            "rotate(" + leftAngle + " 150 174)"
        );
        vuRight.setAttribute(
            "transform",
            "rotate(" + rightAngle + " 850 174)"
        );

        updatePeak(peakLeft, leftLevel);
        updatePeak(peakRight, rightLevel);

        spectrumBars.forEach(function (bar, index) {
            if (!isOnAir) {
                bar.style.height = "3%";
                return;
            }
            const middle = (spectrumCount - 1) / 2;
            const distance =
                Math.abs(index - middle) / middle;
            const centerShape = 1 - distance * .62;
            const wave =
                .56 +
                .22 * Math.sin(phase + index * .43) +
                .17 * Math.sin(phase * .71 - index * .35);
            const variation = Math.random() * 15;
            const height = Math.max(
                5,
                Math.min(
                    97,
                    centerShape * wave * 115 + variation
                )
            );
            bar.style.height = height + "%";
        });
    }

    animate();
    setInterval(animate, 170);
})();
</script>
</body>
</html>
