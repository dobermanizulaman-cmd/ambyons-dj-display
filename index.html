
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmbYonS DJ Display</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050303;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    text-align: center;
}
.display {
    width: 96%;
    padding: 12px;
}
.dj-name {
    color: #ff2525;
    font-size: clamp(32px, 7vw, 95px);
    font-weight: 900;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    text-shadow:
        0 0 10px #ff0000,
        0 0 25px #aa0000;
}
.status {
    color: #ffffff;
    font-size: clamp(25px, 4vw, 55px);
    font-weight: bold;
    margin-top: 15px;
    text-shadow: 0 0 12px #ffffff;
}
</style>
</head>
<body>
<div class="display">
    <div class="dj-name" id="dj">DJ OFFLINE</div>
    <div class="status" id="status"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const dj = (params.get("dj") || "").trim();

document.getElementById("dj").textContent =
    dj || "DJ OFFLINE";

document.getElementById("status").textContent =
    dj ? "ON AIR" : "";
</script>
</body>
</html>
